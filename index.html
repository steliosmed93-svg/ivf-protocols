<style>
/* Layout: σταθερή πλευρική πλοήγηση + κύρια στήλη ανάγνωσης· πίνακες σε οριζόντια κύλιση */
:root{
  --ink:#16222e; --ink-2:#44525f; --ink-3:#6c7884;
  --paper:#f6f7f8; --card:#ffffff; --line:#dde2e7; --tint:#eef2f4;
  --accent:#7a2e5c; --accent-soft:#f4e8ef; --teal:#1f6f78; --teal-soft:#e3f1f2;
  --ok:#2d7a46; --ok-soft:#e5f3e9; --warn:#a46200; --warn-soft:#fbf0dc; --crit:#b3261e; --crit-soft:#fbe7e5;
  --f-display:"Literata",Georgia,"Times New Roman",serif;
  --f-body:"Commissioner","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:8px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ink:#e6ebef; --ink-2:#b5bfc8; --ink-3:#8b96a1; --paper:#11171d; --card:#18212a; --line:#2b3741; --tint:#1e2832;
  --accent:#e59ac4; --accent-soft:#3a2231; --teal:#6cc3cb; --teal-soft:#183338;
  --ok:#73c48d; --ok-soft:#183324; --warn:#f0b35a; --warn-soft:#3a2c14; --crit:#ff8a80; --crit-soft:#3d1c1a; color-scheme:dark;}}
:root[data-theme="dark"]{
  --ink:#e6ebef; --ink-2:#b5bfc8; --ink-3:#8b96a1; --paper:#11171d; --card:#18212a; --line:#2b3741; --tint:#1e2832;
  --accent:#e59ac4; --accent-soft:#3a2231; --teal:#6cc3cb; --teal-soft:#183338;
  --ok:#73c48d; --ok-soft:#183324; --warn:#f0b35a; --warn-soft:#3a2c14; --crit:#ff8a80; --crit-soft:#3d1c1a; color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font:15.5px/1.6 var(--f-body);}
a{color:var(--teal)}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100%}
nav.side{background:var(--card);border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{font-family:var(--f-display);font-weight:650;font-size:20px;line-height:1.2;margin:0 6px 4px}
/*brand*/
.brandlink{display:flex;align-items:center;gap:11px;text-decoration:none;color:inherit;margin:0 6px 8px}
.brandlink .mark{width:46px;height:46px;flex:0 0 46px;border-radius:12px;box-shadow:0 2px 8px rgba(122,46,92,.25)}
.brandlink .brand{display:block;margin:0;font-size:21px;line-height:1.1}
.brand-kicker{display:block;font:600 10.5px/1.4 var(--f-body);letter-spacing:.22em;color:var(--teal);margin-top:2px}
.brandlink.sm{margin:0}.brandlink.sm .mark{width:32px;height:32px;flex-basis:32px;border-radius:8px}.brandlink.sm .brand{font-size:17px}.brandlink.sm .brand-kicker{font-size:9px}
.brand-sub{color:var(--ink-3);font-size:12.5px;margin:0 6px 18px}
.navgrp{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:16px 8px 6px}
.navlink{display:block;padding:7px 10px;border-radius:6px;color:var(--ink-2);text-decoration:none;font-size:14.5px}
.navlink:hover{background:var(--tint);color:var(--ink)}
.navlink.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.navsub{font-size:11.5px;color:var(--ink-3);margin:8px 10px 2px 22px;font-weight:600}
.navlink.sub{padding-left:22px;font-size:14px}
main{padding:28px clamp(16px,4vw,48px) 80px;max-width:1180px;width:100%}
h1,h2,h3{font-family:var(--f-display);font-weight:650;text-wrap:balance;line-height:1.25}
h1{font-size:30px;margin:0 0 6px} h2{font-size:22px;margin:34px 0 10px} h3{font-size:17.5px;margin:22px 0 8px}
.lede{color:var(--ink-2);max-width:72ch;margin:0 0 18px}
p,li{max-width:78ch}
.muted{color:var(--ink-3)}
.small{font-size:13px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
td.mono{white-space:nowrap}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.card h3{margin-top:0}
a.card{text-decoration:none;color:inherit;display:block;transition:border-color .15s}
a.card:hover{border-color:var(--accent)}
.chip{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--tint);color:var(--ink-2);margin:0 4px 4px 0;white-space:nowrap}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.chip.teal{background:var(--teal-soft);color:var(--teal)}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.crit{background:var(--crit-soft);color:var(--crit)}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card);margin:10px 0 6px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 11px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
th{background:var(--tint);font-weight:600;color:var(--ink-2);font-size:12.5px;letter-spacing:.02em;white-space:nowrap}
tr:last-child td{border-bottom:none}
td.when{white-space:nowrap;font-weight:600;color:var(--accent)}
td .drug{font-weight:600}
.callout{border-left:4px solid var(--teal);background:var(--teal-soft);padding:10px 14px;border-radius:0 var(--r) var(--r) 0;margin:12px 0}
.callout.warn{border-color:var(--warn);background:var(--warn-soft)}
.callout.crit{border-color:var(--crit);background:var(--crit-soft)}
.callout.acc{border-color:var(--accent);background:var(--accent-soft)}
.callout p{margin:4px 0}
.cite{color:var(--teal);text-decoration:none;border-bottom:1px dotted var(--teal)}
.reflist li{margin-bottom:8px;padding-left:2em;text-indent:-2em;list-style:none}
.reflist{padding-left:0}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:14px 0 16px}
.tab{background:none;border:none;border-bottom:2px solid transparent;padding:8px 12px;font:inherit;color:var(--ink-2);cursor:pointer}
.tab.on{border-color:var(--accent);color:var(--accent);font-weight:600}
.timeline{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.timeline svg{display:block;min-width:640px;width:100%;height:auto}
.timeline text{font-family:var(--f-body);fill:var(--ink-2)}
.btn{font:inherit;font-size:14px;padding:8px 14px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.pri{color:#1a0f15}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.pri{color:#1a0f15}}
.btn.danger{color:var(--crit)}
.btn.sm{padding:4px 10px;font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--ink-2);font-weight:500}
input,select,textarea{font:inherit;font-size:14.5px;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);min-width:0}
textarea{width:100%;min-height:90px;font-family:var(--f-mono);font-size:12.5px}
.form{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.form .wide{grid-column:span 2}
.pt-list{display:flex;flex-direction:column;gap:6px}
.pt{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:9px 11px;border:1px solid var(--line);border-radius:6px;background:var(--card);cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.pt.on{border-color:var(--accent);background:var(--accent-soft)}
.trk{display:grid;grid-template-columns:240px minmax(0,1fr);gap:18px;align-items:start}
.trk>*{min-width:0}
main{min-width:0}
.alert{display:flex;gap:10px;padding:10px 12px;border-radius:6px;margin-bottom:8px;border:1px solid var(--line);background:var(--card)}
.alert .dot{flex:0 0 8px;border-radius:4px}
.alert.crit .dot{background:var(--crit)} .alert.warn .dot{background:var(--warn)} .alert.ok .dot{background:var(--ok)} .alert.info .dot{background:var(--teal)}
.alert b{display:block}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:10px 0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.kpi .v{font-family:var(--f-mono);font-size:22px;font-weight:600}
.kpi .l{font-size:12px;color:var(--ink-3)}
.bins{display:flex;gap:4px;align-items:flex-end;height:60px}
.dialog-bg{position:fixed;inset:0;background:rgba(10,15,20,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.dialog-bg.on{display:flex}
.dialog{background:var(--card);border-radius:10px;padding:20px;max-width:520px;width:100%;border:1px solid var(--line)}
.topbar{display:none}
details.acc{border:1px solid var(--line);border-radius:var(--r);background:var(--card);padding:0 14px;margin:8px 0}
details.acc summary{cursor:pointer;padding:11px 0;font-weight:600}
.pill-n{font-family:var(--f-mono);font-size:12px;color:var(--ink-3)}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  nav.side{position:fixed;inset:0 30% 0 0;z-index:40;transform:translateX(-102%);transition:transform .2s;height:100%}
  nav.side.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.35)}
  .topbar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
  .trk{grid-template-columns:1fr}
  .form .wide{grid-column:auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

</nav>

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function cite(txt){
  return String(txt).replace(/\{\{([^}]+)\}\}/g,(m,keys)=>{
    const parts = keys.split(";").map(k=>k.trim()).filter(k=>REFS[k]);
    return "(" + parts.map(k=>`<a class="cite" href="#refs" title="${esc(REFS[k].apa.replace(/<[^>]+>/g,""))}">${esc(REFS[k].cite)}</a>`).join("; ") + ")";
  });
}
function refItem(k){const r=REFS[k];return `<li>${r.apa} <a href="https://doi.org/${r.doi}" target="_blank" rel="noopener">https://doi.org/${r.doi}</a></li>`;}
function sortedRefKeys(keys){return [...new Set(keys)].sort((a,b)=>REFS[a].apa.replace(/<[^>]+>/g,"").localeCompare(REFS[b].apa.replace(/<[^>]+>/g,""),"en"));}

function route(){
  const h=(location.hash||"#home").slice(1);
  $("#navlinks").innerHTML=navHTML(h.startsWith("p-")?h:h);
  $("#side").classList.remove("open");
  const v=$("#view");
  if(h==="protocols") v.innerHTML=pageProtocols();
  else if(h.startsWith("p-") && PROTO_BY_ID[h.slice(2)]) v.innerHTML=pageProtocol(PROTO_BY_ID[h.slice(2)]);
  else if(h==="drugs") v.innerHTML=pageDrugs();
  else if(h==="studies") v.innerHTML=pageStudies("all");
  else if(h==="tracker") {v.innerHTML=pageTracker(); bindTracker();}
  else if(h==="refs") v.innerHTML=pageRefs();
  else if(h==="about") v.innerHTML=pageAbout();

function chipLevel(v){const m={"Χαμηλός":"ok","Πολύ χαμηλός":"ok","Ελαχιστοποιημένος":"ok","Χαμηλός (με trigger αγωνιστή)":"ok","Χαμηλός έως μέτριος":"warn","Υψηλότερος":"warn","Κανένας":"ok"};return `<span class="chip ${m[v]||""}">${esc(v)}</span>`;}

function timelineSVG(tl){
  const W=900,lw=150,rh=40,top=10,H=top+tl.rows.length*rh+38;
  const x=d=>lw+ (d-tl.from)/(tl.to-tl.from)*(W-lw-20);
  const col={acc:"var(--accent)",teal:"var(--teal)",ok:"var(--ok)",line:"var(--ink-3)"};
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Χρονοδιάγραμμα πρωτοκόλλου">`;
  tl.ticks.forEach(t=>{s+=`<line x1="${x(t)}" x2="${x(t)}" y1="${top}" y2="${H-30}" stroke="var(--line)"/><text x="${x(t)}" y="${H-14}" font-size="12" text-anchor="middle">${t}</text>`;});
  tl.rows.forEach((r,i)=>{
    const y=top+i*rh;
    s+=`<text x="0" y="${y+24}" font-size="13" font-weight="600" style="fill:var(--ink)">${esc(r.label)}</text>`;
    (r.bars||[]).forEach(b=>{
      const c=col[b.c]||col.acc, w=Math.max(4,x(b.e)-x(b.s));
      s+= b.dash? `<rect x="${x(b.s)}" y="${y+28}" width="${w}" height="5" rx="2" fill="none" stroke="${c}" stroke-dasharray="4 3"/>`
                : `<rect x="${x(b.s)}" y="${y+8}" width="${w}" height="20" rx="4" fill="${c}" opacity=".88"/>`;
      if(b.t) s+=`<text x="${x(b.s)+6}" y="${y+22}" font-size="11.5" style="fill:#fff;font-weight:600">${esc(b.t)}</text>`;
    });
    (r.marks||[]).forEach(d=>{s+=`<circle cx="${x(d)}" cy="${y+18}" r="6" fill="var(--card)" stroke="var(--teal)" stroke-width="2.5"/>`;});
    (r.events||[]).forEach(e=>{const ex=x(e.d),left=ex>W-150;s+=`<path d="M${ex} ${y+8} l7 10 l-7 10 l-7 -10z" fill="var(--crit)"/><text x="${left?ex-10:ex+10}" y="${y+23}" font-size="12" text-anchor="${left?"end":"start"}" style="fill:var(--ink);font-weight:600">${esc(e.t)}</text>`;});
  });
  s+=`<text x="${lw}" y="${H-1}" font-size="11.5" style="fill:var(--ink-3)">${esc(tl.axis)}</text></svg>`;
  return s;
}

/* ---------- Κρυπτογράφηση (AES-GCM 256, κλειδί από PBKDF2-SHA256) ---------- */
const TE=new TextEncoder(), TD=new TextDecoder();
const b64=buf=>{const u=new Uint8Array(buf);let s="";for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s);};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function deriveKey(pass,salt,iter){
  const base=await crypto.subtle.importKey("raw",TE.encode(pass),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
}
async function encObj(obj,key=CKEY){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},key,TE.encode(JSON.stringify(obj)));return {iv:b64(iv),ct:b64(ct)};}
async function decObj(o,key=CKEY){const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(o.iv)},key,unb64(o.ct));return JSON.parse(TD.decode(pt));}

function authErr(e){if(!e)return;const m={"auth/popup-closed-by-user":"Το παράθυρο σύνδεσης έκλεισε.","auth/unauthorized-domain":"Το domain δεν είναι εξουσιοδοτημένο στο Firebase.","auth/network-request-failed":"Πρόβλημα δικτύου. Δοκίμασε ξανά."};const t=m[e.code]||("Η σύνδεση απέτυχε ("+(e.code||e.message)+").");const el=$("#acctMsg");if(el)el.textContent=t;}

async function setupPass(p1){
  const salt=crypto.getRandomValues(new Uint8Array(16));
  const key=await deriveKey(p1,salt,KDF_ITER);
  const verifier=await encObj({check:"ivfprot-ok"},key);
  const cfgEnc=await encObj({...DEFCFG},key);
  const meta={salt:b64(salt),iter:KDF_ITER,kdf:"PBKDF2-SHA256",cipher:"AES-GCM-256",verifier,cfgEnc,created:firebase.firestore.FieldValue.serverTimestamp()};
  await FS.collection("users").doc(USER.uid).set(meta);
  USERMETA=meta; CKEY=key; await loadCloud();
}
async function unlock(pass){
  const key=await deriveKey(pass,unb64(USERMETA.salt),USERMETA.iter||KDF_ITER);
  try{const v=await decObj(USERMETA.verifier,key);if(v.check!=="ivfprot-ok")throw 0;}catch(e){return false;}
  CKEY=key; await loadCloud(); return true;
}
async function loadCloud(){
  SYNC="Φόρτωση…"; const pats=[]; LAST={};
  const qs=await FS.collection("users").doc(USER.uid).collection("patients").get();
  for(const d of qs.docs){try{const p=normPatient(await decObj(d.data()));p.id=d.id;pats.push(p);LAST[d.id]=JSON.stringify(p);}catch(e){console.warn("decrypt",d.id);}}
  let cfg={...DEFCFG}; try{if(USERMETA.cfgEnc)cfg={...DEFCFG,...(await decObj(USERMETA.cfgEnc))};}catch(e){}
  LASTCFG=JSON.stringify(cfg);
  pats.sort((a,b)=>(a.code||"").localeCompare(b.code||"","el"));
  DB={patients:pats,cfg}; CUR=null; CURC=null; MODE="cloud"; SYNC="Συγχρονισμένο"; renderAcct(); afterModeChange();
}
let cloudTimer=null, cloudBusy=false, cloudAgain=false;
function queueCloud(){SYNC="Αποθήκευση…";setSync();clearTimeout(cloudTimer);cloudTimer=setTimeout(flushCloud,400);}
async function flushCloud(){
  if(cloudBusy){cloudAgain=true;return;} cloudBusy=true;
  try{
    const col=FS.collection("users").doc(USER.uid).collection("patients"); const ids=new Set();
    for(const p of DB.patients){ids.add(p.id);const s=JSON.stringify(p);if(LAST[p.id]!==s){const e=await encObj(p);await col.doc(p.id).set({...e,updated:firebase.firestore.FieldValue.serverTimestamp()});LAST[p.id]=s;}}
    for(const id of Object.keys(LAST)) if(!ids.has(id)){await col.doc(id).delete();delete LAST[id];}
    const cs=JSON.stringify(DB.cfg); if(cs!==LASTCFG){const e=await encObj(DB.cfg);await FS.collection("users").doc(USER.uid).update({cfgEnc:e});LASTCFG=cs;}
    SYNC="Αποθηκεύτηκε "+new Date().toLocaleTimeString("el-GR",{hour:"2-digit",minute:"2-digit"});
  }catch(e){SYNC="Σφάλμα αποθήκευσης ("+(e.code||e.message)+"). Οι αλλαγές θα ξαναδοκιμαστούν.";setTimeout(queueCloud,5000);}
  cloudBusy=false; setSync(); if(cloudAgain){cloudAgain=false;flushCloud();}
}

const AUTOLOCK_MIN=15; let LASTACT=Date.now();

function sizes(v){return [...String(v.R||"").split(/[,\s;]+/),...String(v.L||"").split(/[,\s;]+/)].map(Number).filter(n=>n>0);}
function sizesSide(s){return String(s||"").split(/[,\s;]+/).map(Number).filter(n=>n>0);}
function dayOf(p,v){if(!p.start||!v.date)return "";return Math.round((new Date(v.date+"T12:00:00")-new Date(p.start+"T12:00:00"))/864e5)+1;}
function poseidon(p){
  const low=(p.amh!==""&&+p.amh<1.2)||(p.afc!==""&&+p.afc<5), old=+p.age>=35, prev=p.prevOoc===""?null:+p.prevOoc;
  if(p.age===""||(p.amh===""&&p.afc==="")) return {g:"—",t:"Συμπλήρωσε ηλικία και AMH ή AFC"};
  if(low) return {g:old?"Ομάδα 4":"Ομάδα 3",t:`${old?"≥ 35":"< 35"} ετών, χαμηλή εφεδρεία (AMH < 1,2 ng/mL ή AFC < 5)`};
  if(prev!==null&&prev<=9) return {g:(old?"Ομάδα 2":"Ομάδα 1")+(prev<4?"a":"b"),t:`Επαρκής εφεδρεία με απρόσμενα ${prev<4?"χαμηλή (< 4 ωάρια)":"υποβέλτιστη (4–9 ωάρια)"} απάντηση σε προηγούμενο κύκλο`};
  return {g:"Εκτός POSEIDON",t:"Επαρκής εφεδρεία χωρίς ιστορικό χαμηλής απάντησης"};
}
function alertsFor(p){
  const c=DB.cfg, out=[], vs=[...p.visits].sort((a,b)=>a.date.localeCompare(b.date)), v=vs[vs.length-1];
  const proto=p.proto, stim=STIM_IDS.includes(proto), agFam=["long-agonist","flare","ultra-long"].includes(proto);
  if(proto==="ppos") out.push(["info","Freeze-all υποχρεωτικό","Στην PPOS το ενδομήτριο δεν είναι δεκτικό· δεν γίνεται φρέσκια μεταφορά."]);
  if(!v) {out.push(["info","Καμία επίσκεψη","Πρόσθεσε την πρώτη επίσκεψη για να ενεργοποιηθούν οι ειδοποιήσεις."]);return out;}
  const s=sizes(v), d=dayOf(p,v), lead=s.length?Math.max(...s):0;
  const nT=s.filter(x=>x>=c.trigSize).length, nO=s.filter(x=>x>=c.ohssSize).length;
  if(stim){
    if(proto==="long-agonist"&&(v.type==="down"||d<=0)){
      const bad=[]; if(+v.e2>50)bad.push("E2 > 50 pg/mL"); if(+v.endo>5)bad.push("ενδομήτριο > 5 mm"); if(+v.lh>=5)bad.push("LH ≥ 5 IU/L"); if(lead>10)bad.push("κύστη/ωοθυλάκιο > 10 mm");
      out.push(bad.length?["warn","Ατελής καταστολή",bad.join(", ")+". Συνέχισε τον αγωνιστή και επανέλεγξε σε 5–7 ημέρες."]:["ok","Επαρκής καταστολή","Μπορεί να ξεκινήσει η διέγερση με γοναδοτροπίνες."]);

      out.push(["crit","Υψηλός κίνδυνος OHSS",why+". "+(agFam?"Trigger με αγωνιστή δεν είναι εφικτό: εξέτασε μειωμένη δόση hCG, freeze-all, καβεργολίνη ή ακύρωση.":"Εξέτασε trigger με αγωνιστή GnRH και freeze-all.")]);

    else if(lead>=c.trigSize) out.push(["info","Πλησιάζει το trigger",`Ηγετικό ${lead} mm, ${nT}/${c.trigN} ωοθυλάκια στο όριο. Επανέλεγχος σε 1–2 ημέρες.`]);
    if(["antagonist","mild","duostim","fp-random"].includes(proto)&&(d>=c.antFix||lead>=c.antFlex)) out.push(["warn","Ανταγωνιστής",`Ημέρα διέγερσης ${d}, ηγετικό ${lead||"–"} mm: βεβαιώσου ότι χορηγείται ανταγωνιστής καθημερινά (σταθερό από Η${c.antFix} ή ευέλικτο από ${c.antFlex} mm).`]);
    if(v.lh!==""&&+v.lh>=c.lhSurge&&proto!=="ppos") out.push(["crit","Πιθανή πρόωρη άνοδος LH",`LH ${v.lh} IU/L. Επανέλεγχος άμεσα· εξέτασε άμεσο trigger ή ακύρωση ανάλογα με το μέγεθος.`]);
    if(v.lh!==""&&+v.lh>=c.lhSurge&&proto==="ppos") out.push(["warn","Άνοδος LH σε PPOS",`LH ${v.lh} IU/L. Έλεγξε συμμόρφωση στο προγεσταγόνο και τη δυναμική της LH.`]);
    if(v.p4!==""&&+v.p4>=c.p4Trig&&proto!=="ppos") out.push(["warn","Αυξημένη P4",`P4 ${v.p4} ng/mL. Αν επιμένει την ημέρα του trigger, εξέτασε freeze-all.`]);
    if(s.length&&nT&&v.e2) out.push(["info","E2 ανά ωοθυλάκιο ≥ 14 mm",`${Math.round(+v.e2/Math.max(1,s.filter(x=>x>=14).length))} pg/mL (αναμενόμενο περίπου 200–300 σε ώριμα ωοθυλάκια).`]);
  }
  if(proto==="fet-hrt"){
    if(v.type==="et"){
      if(v.p4!==""&&+v.p4<c.p4ET) out.push(["warn","Χαμηλή P4 την ημέρα της ET",`P4 ${v.p4} ng/mL < ${c.p4ET}. Εξέτασε εξατομικευμένη ενίσχυση (π.χ. P4 25 mg υποδόρια).`]);
      else if(v.p4!=="") out.push(["ok","Επαρκής P4 την ημέρα της ET",`P4 ${v.p4} ng/mL.`]);

      else if(v.endo!==""&&+v.endo<c.endoMin&&d>=10) out.push(["warn","Λεπτό ενδομήτριο",`${v.endo} mm < ${c.endoMin} την ημέρα ${d}. Εξέτασε παράταση ή αλλαγή οδού οιστρογόνων.`]);

    else if(lead>=17&&(v.endo===""||+v.endo>=c.endoMin)) out.push(["info","Κυρίαρχο ωοθυλάκιο ≥ 17 mm",`${lead} mm. Τροποποιημένος κύκλος: εξέτασε hCG τώρα και μεταφορά βλαστοκύστης hCG+7 (${isoAdd(v.date,7)}). Φυσικός: συνέχισε μετρήσεις LH.`]);
    else if(lead&&lead<17) out.push(["info","Ανάπτυξη ωοθυλακίου",`Κυρίαρχο ${lead} mm. Επανέλεγχος σε 1–3 ημέρες ανάλογα με το μέγεθος.`]);
    if(v.endo!==""&&+v.endo<c.endoMin&&lead>=15) out.push(["warn","Λεπτό ενδομήτριο",`${v.endo} mm < ${c.endoMin}.`]);
    if(sizes(v).filter(x=>x>=15).length>=3&&proto==="fet-letrozole") out.push(["warn","Πολλαπλά κυρίαρχα ωοθυλάκια","≥ 3 ωοθυλάκια ≥ 15 mm: κίνδυνος πολύδυμης κύησης αν υπάρξει επαφή· ενημέρωσε την ασθενή."]);
  }

    else{const o=new Date(t.getTime()+c.opuH*36e5);out.push(["info","Προγραμματισμός ωοληψίας",`Trigger ${fmtDT(t)} → ωοληψία ${fmtDT(o)} (${c.opuH} ώρες).`]);}}}

function chartSVG(p){
  const vs=[...p.visits].sort((a,b)=>a.date.localeCompare(b.date)).filter(v=>p.start);
  if(!vs.length) return `<p class="muted small">Δεν υπάρχουν μετρήσεις ακόμη.</p>`;
  const days=vs.map(v=>dayOf(p,v)); const dMin=Math.min(1,...days), dMax=Math.max(dMin+6,...days)+1;
  const W=720,H=300,L=44,R=54,T=14,B=34; const e2max=Math.max(1000,...vs.map(v=>+v.e2||0))*1.1;
  const x=d=>L+(d-dMin)/(dMax-dMin)*(W-L-R), y=mm=>T+(1-mm/26)*(H-T-B), y2=e=>T+(1-e/e2max)*(H-T-B);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Γράφημα ανάπτυξης ωοθυλακίων και E2" style="min-width:560px">`;
  [0,5,10,15,20,25].forEach(m=>{s+=`<line x1="${L}" x2="${W-R}" y1="${y(m)}" y2="${y(m)}" stroke="var(--line)"/><text x="${L-8}" y="${y(m)+4}" font-size="11" text-anchor="end">${m}</text>`;});
  s+=`<rect x="${L}" y="${y(20)}" width="${W-L-R}" height="${y(DB.cfg.trigSize)-y(20)}" fill="var(--ok)" opacity=".10"/>`;
  for(let d=Math.ceil(dMin);d<=dMax;d++) s+=`<text x="${x(d)}" y="${H-14}" font-size="11" text-anchor="middle">${d}</text>`;
  const e2pts=vs.filter(v=>v.e2!==""&&v.e2!=null).map(v=>[x(dayOf(p,v)),y2(+v.e2)]);
  if(e2pts.length>1) s+=`<path d="M${e2pts.map(q=>q.join(" ")).join(" L")}" fill="none" stroke="var(--accent)" stroke-width="2"/>`;
  e2pts.forEach(q=>s+=`<circle cx="${q[0]}" cy="${q[1]}" r="3.5" fill="var(--accent)"/>`);
  [0,.5,1].forEach(f=>s+=`<text x="${W-R+6}" y="${y2(e2max*f)+4}" font-size="11" style="fill:var(--accent)">${Math.round(e2max*f)}</text>`);
  vs.forEach(v=>{const d=dayOf(p,v);
    sizesSide(v.R).forEach((m,i)=>s+=`<circle cx="${x(d)-5}" cy="${y(m)}" r="4" fill="var(--teal)" opacity=".8"/>`);
    sizesSide(v.L).forEach((m,i)=>s+=`<rect x="${x(d)+2}" y="${y(m)-3.5}" width="7" height="7" fill="var(--ink-2)" opacity=".8"/>`);
    const ss=sizes(v); if(ss.length) s+=`<text x="${x(d)}" y="${y(Math.max(...ss))-9}" font-size="11" text-anchor="middle" style="fill:var(--ink);font-weight:600">${Math.max(...ss)}</text>`;
  });
  s+=`<text x="${L}" y="${H-1}" font-size="11" style="fill:var(--ink-3)">${FET_IDS.includes(p.proto)?"Ημέρα κύκλου":"Ημέρα διέγερσης"} · αριστερός άξονας: mm · δεξιός: E2 pg/mL</text></svg>`;
  return `<div class="timeline">${s}</div><p class="small muted"><span style="color:var(--teal)">●</span> δεξιά ωοθήκη &nbsp; <span style="color:var(--ink-2)">■</span> αριστερή ωοθήκη &nbsp; <span style="color:var(--accent)">—</span> E2 &nbsp; πράσινη ζώνη: ${DB.cfg.trigSize}–20 mm</p>`;
}
function binsRow(v){
  const s=sizes(v), b=[["<10",x=>x<10],["10–13",x=>x>=10&&x<14],["14–16",x=>x>=14&&x<17],["17–19",x=>x>=17&&x<20],["≥20",x=>x>=20]];
  return b.map(([l,f])=>`<span class="chip">${l}: <b class="mono">${s.filter(f).length}</b></span>`).join("");
}

function refreshTracker(){$("#view").innerHTML=pageTracker();bindTracker();}
function bindTracker(){
  const go=$("#pwGo");
  if(MODE==="cloud-locked"&&go){
    const msg=t=>$("#pwMsg").textContent=t;
    go.onclick=async()=>{
      go.disabled=true;
      try{
        if(USERMETA){msg("Έλεγχος…");const ok=await unlock($("#pwU").value);if(!ok){msg("Λάθος συνθηματικό.");go.disabled=false;}}
        else{const a=$("#pw1").value,b=$("#pw2").value;if(a.length<10){msg("Χρειάζονται τουλάχιστον 10 χαρακτήρες.");go.disabled=false;return;}if(a!==b){msg("Τα δύο συνθηματικά δεν ταιριάζουν.");go.disabled=false;return;}msg("Δημιουργία…");await setupPass(a);}
      }catch(e){msg("Σφάλμα: "+(e.code||e.message));go.disabled=false;}
    };
    document.querySelectorAll("#pwU,#pw2").forEach(i=>i.addEventListener("keydown",e=>{if(e.key==="Enter")go.click();}));
    return;
  }
  if(!$("#newPt")) return;
  const imp=$("#impLocal"); if(imp) imp.onclick=()=>{const L=(readLocal()||{patients:[]}).patients.filter(x=>!x.example);const have=new Set(DB.patients.map(x=>x.id));L.forEach(x=>{if(have.has(x.id))x.id=uid();DB.patients.push(x);});save();refreshTracker();};
  document.querySelectorAll("[data-pt]").forEach(b=>b.onclick=()=>{CUR=b.dataset.pt;CURC=null;refreshTracker();});
  $("#ptSearch").oninput=e=>{$("#ptList").innerHTML=ptListHTML(e.target.value);document.querySelectorAll("[data-pt]").forEach(b=>b.onclick=()=>{CUR=b.dataset.pt;CURC=null;refreshTracker();});};
  $("#newPt").onclick=()=>{const c=newCycle(1);const n={id:uid(),code:"",age:"",bmi:"",amh:"",afc:"",prevOoc:"",dx:"",notes:"",cycles:[c]};DB.patients.unshift(n);CUR=n.id;CURC=c.id;save();refreshTracker();setTimeout(()=>{const e=$("#f_code");e&&e.focus();},30);};
  $("#cfgBtn").onclick=cfgForm;
  $("#bkCopy").onclick=async()=>{const t=JSON.stringify(DB);try{await navigator.clipboard.writeText(t);$("#bkMsg").textContent="Αντιγράφηκε (μη κρυπτογραφημένο). Φύλαξέ το σε ασφαλές σημείο.";}catch(e){openDlg(`<h3 style="margin-top:0">Αντίγραφο ασφαλείας</h3><p class="small">Επίλεξε και αντίγραψε το κείμενο. Δεν είναι κρυπτογραφημένο.</p><textarea readonly>${esc(t)}</textarea><div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn" onclick="closeDlg()">Κλείσιμο</button></div>`);}};
  $("#bkRestore").onclick=()=>{openDlg(`<h3 style="margin-top:0">Επαναφορά</h3><p class="small">Επικόλλησε το αντίγραφο ή διάλεξε αρχείο .json/.txt. Οι φάκελοι του αντιγράφου θα αντικαταστήσουν τους τρέχοντες.</p><input type="file" id="rsFile" accept=".json,.txt"><textarea id="rsTxt" style="margin-top:8px"></textarea><p class="small" id="rsMsg" style="color:var(--crit)"></p><div class="row" style="justify-content:flex-end"><button class="btn" onclick="closeDlg()">Ακύρωση</button><button class="btn pri" id="rsGo">Επαναφορά</button></div>`);
    $("#rsFile").onchange=e=>{const fl=e.target.files[0];if(fl)fl.text().then(t=>$("#rsTxt").value=t);};
    $("#rsGo").onclick=()=>{try{const d=JSON.parse($("#rsTxt").value);if(!Array.isArray(d.patients))throw 0;DB={patients:d.patients.map(normPatient),cfg:{...DEFCFG,...(d.cfg||{})}};save();CUR=null;CURC=null;closeDlg();refreshTracker();}catch(e){$("#rsMsg").textContent="Το κείμενο δεν είναι έγκυρο αντίγραφο της εφαρμογής.";}};};
  const p=DB.patients.find(x=>x.id===CUR); if(!p) return;
  const c=p.cycles.find(x=>x.id===CURC);
  document.querySelectorAll("[data-f]").forEach(el=>el.onchange=()=>{p[el.dataset.f]=el.value.trim();if(el.dataset.f==="code")p.example=false;save();refreshTracker();});
  document.querySelectorAll("[data-cyc]").forEach(b=>b.onclick=()=>{CURC=b.dataset.cyc;refreshTracker();});
  $("#addCyc").onclick=()=>{const n=newCycle(p.cycles.length+1);p.cycles.push(n);CURC=n.id;save();refreshTracker();};
  $("#delPt").onclick=()=>{openDlg(`<h3 style="margin-top:0">Διαγραφή φακέλου</h3><p>Να διαγραφεί οριστικά ο φάκελος <b>${esc(p.code||"χωρίς κωδικό")}</b> με όλους τους κύκλους και τις επισκέψεις;</p><div class="row" style="justify-content:flex-end"><button class="btn" onclick="closeDlg()">Ακύρωση</button><button class="btn pri" id="dGo">Διαγραφή</button></div>`);$("#dGo").onclick=()=>{DB.patients=DB.patients.filter(x=>x.id!==p.id);CUR=null;CURC=null;save();closeDlg();refreshTracker();};};
  if(!c) return;
  document.querySelectorAll("[data-cy]").forEach(el=>el.onchange=()=>{c[el.dataset.cy]=el.value.trim();save();refreshTracker();});
  document.querySelectorAll("[data-out]").forEach(el=>el.onchange=()=>{c.out=c.out||{};c.out[el.dataset.out]=el.value.trim();save();refreshTracker();});
  $("#addV").onclick=()=>visitForm(c);
  document.querySelectorAll("[data-ev]").forEach(b=>b.onclick=()=>visitForm(c,c.visits.find(v=>v.id===b.dataset.ev)));
  const dc=$("#delCyc"); if(dc) dc.onclick=()=>{openDlg(`<h3 style="margin-top:0">Διαγραφή κύκλου</h3><p>Να διαγραφεί οριστικά ο «${esc(c.label)}» και οι επισκέψεις του;</p><div class="row" style="justify-content:flex-end"><button class="btn" onclick="closeDlg()">Ακύρωση</button><button class="btn pri" id="dGo">Διαγραφή</button></div>`);$("#dGo").onclick=()=>{p.cycles=p.cycles.filter(x=>x.id!==c.id);CURC=null;save();closeDlg();refreshTracker();};};
}

const RESULTS=["","Σε αναμονή","Αρνητικό","Βιοχημική κύηση","Κλινική κύηση","Αποβολή","Έκτοπη κύηση","Ζώσα γέννηση","Ακύρωση κύκλου"];

   ${o.etDate&&!o.bhcg?`<p class="small muted" style="margin-bottom:0">Προτεινόμενη βhCG για μεταφορά βλαστοκύστης: ${isoAdd(o.etDate,9)} έως ${isoAdd(o.etDate,11)}.</p>`:""}</div>`;
}
function visitForm(p,v){
  v=v||{id:"",date:new Date().toISOString().slice(0,10),type:"mon",e2:"",lh:"",p4:"",endo:"",pat:"",R:"",L:"",drugs:""};
  const i=(k,l,t="text",x="")=>`<label class="f" for="v_${k}">${l}<input id="v_${k}" data-v="${k}" type="${t}" value="${esc(v[k]??"")}" ${x}></label>`;
  openDlg(`<h3 style="margin-top:0">${v.id?"Επεξεργασία":"Νέα"} επίσκεψη</h3><div class="form">
   ${i("date","Ημερομηνία","date")}<label class="f" for="v_type">Τύπος<select id="v_type" data-v="type">${VTYPES.map(t=>`<option value="${t[0]}"${v.type===t[0]?" selected":""}>${t[1]}</option>`).join("")}</select></label>
   <label class="f wide" for="v_R">Δεξιά ωοθήκη: μεγέθη σε mm, με κόμμα<input id="v_R" data-v="R" value="${esc(v.R)}" placeholder="π.χ. 18,17,15,12" inputmode="decimal"></label>
   <label class="f wide" for="v_L">Αριστερή ωοθήκη: μεγέθη σε mm<input id="v_L" data-v="L" value="${esc(v.L)}" placeholder="π.χ. 16,14,11" inputmode="decimal"></label>
   ${i("e2","E2 (pg/mL)","number")}${i("lh","LH (IU/L)","number",'step="0.1"')}${i("p4","P4 (ng/mL)","number",'step="0.01"')}${i("endo","Ενδομήτριο (mm)","number",'step="0.1"')}
   ${i("pat","Μορφολογία ενδομ.")}<label class="f wide" for="v_drugs">Φάρμακα / δόσεις<input id="v_drugs" data-v="drugs" value="${esc(v.drugs)}"></label></div>
   <p class="small muted">Μονάδες: E2 pmol/L ÷ 3,67 = pg/mL · P4 nmol/L ÷ 3,18 = ng/mL</p>
   <div class="row" style="justify-content:flex-end;margin-top:12px">${v.id?`<button class="btn danger" id="vDel">Διαγραφή</button>`:""}<button class="btn" id="vCancel">Ακύρωση</button><button class="btn pri" id="vSave">Αποθήκευση</button></div>`);
  $("#vCancel").onclick=closeDlg;
  if(v.id) $("#vDel").onclick=()=>{p.visits=p.visits.filter(x=>x.id!==v.id);save();closeDlg();refreshTracker();};
  $("#vSave").onclick=()=>{
    const nv={id:v.id||uid()}; document.querySelectorAll("[data-v]").forEach(el=>nv[el.dataset.v]=el.value.trim());
    if(!nv.date){$("#v_date").focus();return;}
    const ix=p.visits.findIndex(x=>x.id===nv.id); if(ix>=0)p.visits[ix]=nv; else p.visits.push(nv);
    save();closeDlg();refreshTracker();
  };
}
function cfgForm(){
  const c=DB.cfg, L={trigN:"Trigger: αριθμός ωοθυλακίων",trigSize:"Trigger: μέγεθος (mm)",ohssN:"OHSS: αριθμός ωοθυλακίων",ohssSize:"OHSS: μέγεθος (mm)",e2Ohss:"OHSS: E2 (pg/mL)",p4Trig:"P4 για freeze-all (ng/mL)",lhSurge:"Πρόωρη LH (IU/L)",antFix:"Ανταγωνιστής σταθερό: ημέρα",antFlex:"Ανταγωνιστής ευέλικτο: mm",endoMin:"FET: ελάχιστο ενδομήτριο (mm)",p4ET:"FET: ελάχιστη P4 ημέρα ET",opuH:"Ώρες trigger → OPU"};
  openDlg(`<h3 style="margin-top:0">Όρια ειδοποιήσεων</h3><p class="small muted">Προσάρμοσε στα πρωτόκολλα του κέντρου σου.</p><div class="form">${Object.keys(L).map(k=>`<label class="f" for="c_${k}">${L[k]}<input id="c_${k}" data-c="${k}" type="number" step="0.1" value="${c[k]}"></label>`).join("")}</div>
  <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn" id="cReset">Προεπιλογές</button><button class="btn" id="cCancel">Ακύρωση</button><button class="btn pri" id="cSave">Αποθήκευση</button></div>`);
  $("#cCancel").onclick=closeDlg;
  $("#cReset").onclick=()=>{DB.cfg={...DEFCFG};save();closeDlg();refreshTracker();};
  $("#cSave").onclick=()=>{document.querySelectorAll("[data-c]").forEach(el=>{const n=parseFloat(el.value);if(!isNaN(n))DB.cfg[el.dataset.c]=n;});save();closeDlg();refreshTracker();};
}
function openDlg(h){$("#dlgBox").innerHTML=h;$("#dlg").classList.add("on");const f=$("#dlgBox input,#dlgBox select,#dlgBox button");f&&f.focus();}
function closeDlg(){$("#dlg").classList.remove("on");}
/* ================= ΕΚΚΙΝΗΣΗ ================= */
loadLocal();
renderAcct();
initFirebase();
$("#dlg").addEventListener("click",e=>{if(e.target.id==="dlg")closeDlg();});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDlg();});
$("#menuBtn").onclick=()=>$("#side").classList.toggle("open");
window.addEventListener("hashchange",route);
route();
</script>
