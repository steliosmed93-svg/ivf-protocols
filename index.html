<style>
/* Layout: σταθερή πλευρική πλοήγηση + κύρια στήλη ανάγνωσης· πίνακες σε οριζόντια κύλιση */
:root{
  --ink:#16222e; --ink-2:#44525f; --ink-3:#6c7884;
  --paper:#f6f7f8; --card:#ffffff; --line:#dde2e7; --tint:#eef2f4;
  --accent:#7a2e5c; --accent-soft:#f4e8ef; --teal:#1f6f78; --teal-soft:#e3f1f2;
  --ok:#2d7a46; --ok-soft:#e5f3e9; --warn:#a46200; --warn-soft:#fbf0dc; --crit:#b3261e; --crit-soft:#fbe7e5;
  --f-display:"Literata",Georgia,"Times New Roman",serif;
  --f-body:"Commissioner","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:8px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ink:#e6ebef; --ink-2:#b5bfc8; --ink-3:#8b96a1; --paper:#11171d; --card:#18212a; --line:#2b3741; --tint:#1e2832;
  --accent:#e59ac4; --accent-soft:#3a2231; --teal:#6cc3cb; --teal-soft:#183338;
  --ok:#73c48d; --ok-soft:#183324; --warn:#f0b35a; --warn-soft:#3a2c14; --crit:#ff8a80; --crit-soft:#3d1c1a; color-scheme:dark;}}
:root[data-theme="dark"]{
  --ink:#e6ebef; --ink-2:#b5bfc8; --ink-3:#8b96a1; --paper:#11171d; --card:#18212a; --line:#2b3741; --tint:#1e2832;
  --accent:#e59ac4; --accent-soft:#3a2231; --teal:#6cc3cb; --teal-soft:#183338;
  --ok:#73c48d; --ok-soft:#183324; --warn:#f0b35a; --warn-soft:#3a2c14; --crit:#ff8a80; --crit-soft:#3d1c1a; color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font:15.5px/1.6 var(--f-body);}
a{color:var(--teal)}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100%}
nav.side{background:var(--card);border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{font-family:var(--f-display);font-weight:650;font-size:20px;line-height:1.2;margin:0 6px 4px}
/*brand*/
.brandlink{display:flex;align-items:center;gap:11px;text-decoration:none;color:inherit;margin:0 6px 8px}
.brandlink .mark{width:46px;height:46px;flex:0 0 46px;border-radius:12px;box-shadow:0 2px 8px rgba(122,46,92,.25)}
.brandlink .brand{display:block;margin:0;font-size:21px;line-height:1.1}
.brand-kicker{display:block;font:600 10.5px/1.4 var(--f-body);letter-spacing:.22em;color:var(--teal);margin-top:2px}
.brandlink.sm{margin:0}.brandlink.sm .mark{width:32px;height:32px;flex-basis:32px;border-radius:8px}.brandlink.sm .brand{font-size:17px}.brandlink.sm .brand-kicker{font-size:9px}
.langsw{margin:-8px 6px 14px}.langsw a{font-size:13px;font-weight:600;color:var(--teal);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:3px 10px}.langsw a:hover{border-color:var(--teal)}
.brand-sub{color:var(--ink-3);font-size:12.5px;margin:0 6px 18px}
.navgrp{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:16px 8px 6px}
.navlink{display:block;padding:7px 10px;border-radius:6px;color:var(--ink-2);text-decoration:none;font-size:14.5px}
.navlink:hover{background:var(--tint);color:var(--ink)}
.navlink.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
details.navdd{margin:2px 0}
details.navdd>summary{list-style:none;display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border-radius:6px;cursor:pointer;color:var(--ink-2);font-size:14.5px;margin-left:12px}
details.navdd>summary::-webkit-details-marker{display:none}
details.navdd>summary::before{content:"▸";font-size:11px;margin-right:8px;color:var(--ink-3);transition:transform .15s}
details.navdd[open]>summary::before{transform:rotate(90deg)}
details.navdd>summary:hover{background:var(--tint);color:var(--ink)}
details.navdd>summary .pill-n{margin-left:auto}
details.navdd .navlink.sub{padding-left:34px}
.navsub{font-size:11.5px;color:var(--ink-3);margin:8px 10px 2px 22px;font-weight:600}
.navlink.sub{padding-left:22px;font-size:14px}
main{padding:28px clamp(16px,4vw,48px) 80px;max-width:1180px;width:100%}
h1,h2,h3{font-family:var(--f-display);font-weight:650;text-wrap:balance;line-height:1.25}
h1{font-size:30px;margin:0 0 6px} h2{font-size:22px;margin:34px 0 10px} h3{font-size:17.5px;margin:22px 0 8px}
.lede{color:var(--ink-2);max-width:72ch;margin:0 0 18px}
p,li{max-width:78ch}
.muted{color:var(--ink-3)}
.small{font-size:13px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
td.mono{white-space:nowrap}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.card h3{margin-top:0}
a.card{text-decoration:none;color:inherit;display:block;transition:border-color .15s}
a.card:hover{border-color:var(--accent)}
.chip{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--tint);color:var(--ink-2);margin:0 4px 4px 0;white-space:nowrap}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.chip.teal{background:var(--teal-soft);color:var(--teal)}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.crit{background:var(--crit-soft);color:var(--crit)}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card);margin:10px 0 6px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 11px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
th{background:var(--tint);font-weight:600;color:var(--ink-2);font-size:12.5px;letter-spacing:.02em;white-space:nowrap}
tr:last-child td{border-bottom:none}
td.when{white-space:nowrap;font-weight:600;color:var(--accent)}
td .drug{font-weight:600}
.callout{border-left:4px solid var(--teal);background:var(--teal-soft);padding:10px 14px;border-radius:0 var(--r) var(--r) 0;margin:12px 0}
.callout.warn{border-color:var(--warn);background:var(--warn-soft)}
.callout.crit{border-color:var(--crit);background:var(--crit-soft)}
.callout.acc{border-color:var(--accent);background:var(--accent-soft)}
.callout p{margin:4px 0}
.cite{color:var(--teal);text-decoration:none;border-bottom:1px dotted var(--teal)}
.reflist li{margin-bottom:8px;padding-left:2em;text-indent:-2em;list-style:none}
.reflist{padding-left:0}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:14px 0 16px}
.tab{background:none;border:none;border-bottom:2px solid transparent;padding:8px 12px;font:inherit;color:var(--ink-2);cursor:pointer}
.tab.on{border-color:var(--accent);color:var(--accent);font-weight:600}
.timeline{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.timeline svg{display:block;min-width:640px;width:100%;height:auto}
.timeline text{font-family:var(--f-body);fill:var(--ink-2)}
.btn{font:inherit;font-size:14px;padding:8px 14px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.pri{color:#1a0f15}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.pri{color:#1a0f15}}
.btn.danger{color:var(--crit)}
.btn.sm{padding:4px 10px;font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--ink-2);font-weight:500}
input,select,textarea{font:inherit;font-size:14.5px;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);min-width:0}
textarea{width:100%;min-height:90px;font-family:var(--f-mono);font-size:12.5px}
.form{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.form .wide{grid-column:span 2}
.pt-list{display:flex;flex-direction:column;gap:6px}
.pt{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:9px 11px;border:1px solid var(--line);border-radius:6px;background:var(--card);cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.pt.on{border-color:var(--accent);background:var(--accent-soft)}
.pt.done{border-color:var(--ok);background:var(--ok-soft);border-width:1.5px}.pt.done.on{box-shadow:0 0 0 2px var(--accent)}
.cb.done{border-color:var(--ok)!important;background:var(--ok-soft)!important;color:var(--ok)!important}.cb.done.on{background:var(--ok)!important;color:#fff!important}
.trk{display:grid;grid-template-columns:240px minmax(0,1fr);gap:18px;align-items:start}
.trk>*{min-width:0}
main{min-width:0}
.alert{display:flex;gap:10px;padding:10px 12px;border-radius:6px;margin-bottom:8px;border:1px solid var(--line);background:var(--card)}
.alert .dot{flex:0 0 8px;border-radius:4px}
.alert.crit .dot{background:var(--crit)} .alert.warn .dot{background:var(--warn)} .alert.ok .dot{background:var(--ok)} .alert.info .dot{background:var(--teal)}
.alert b{display:block}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:10px 0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.kpi .v{font-family:var(--f-mono);font-size:22px;font-weight:600}
.kpi .l{font-size:12px;color:var(--ink-3)}
.bins{display:flex;gap:4px;align-items:flex-end;height:60px}
.dialog-bg{position:fixed;inset:0;background:rgba(10,15,20,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.dialog-bg.on{display:flex}
.dialog{background:var(--card);border-radius:10px;padding:20px;max-width:520px;width:100%;border:1px solid var(--line)}
.topbar{display:none}
.cardbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);margin:0 0 14px}
.cardbar .cb{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 12px;font:inherit;font-size:13.5px;cursor:pointer;color:var(--ink)}
.cardbar .cb.on{background:var(--accent);border-color:var(--accent);color:#fff}
.cardbar select{margin-left:auto;font-size:13.5px}
@media (max-width:600px){.cardbar select{margin-left:0;width:100%}}
.scrim{display:none;position:fixed;inset:0;background:rgba(10,15,20,.45);z-index:39}
.navclose{display:none;margin:0 0 12px auto}
.backrow{margin:0 0 10px}
body.athome .backbtn{visibility:hidden}
body.athome .backrow{display:none}
.mech{margin:6px 0 14px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--paper)}
.mech h4{margin:0 0 8px;font-size:15px;color:var(--accent)}
.mech figure{margin:0}.mechsvg{width:100%;max-width:640px;height:auto;display:block;margin:0 auto}
.mech figcaption{font-size:12px;color:var(--ink-3);margin:6px 0 4px;text-align:center}
.msteps{margin:8px 0 0;padding-left:22px}.msteps li{margin:5px 0;line-height:1.5}
abbr[title]{text-decoration:underline dotted;text-underline-offset:2px;cursor:help}
#abbrTip{position:absolute;z-index:99;max-width:300px;background:var(--ink);color:var(--paper);font-size:13px;padding:7px 10px;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.abbrbox{margin:28px 0 8px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);padding:0 14px}
.abbrbox summary{cursor:pointer;padding:11px 0;font-weight:600}
.abbrbox dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:4px 18px;margin:0 0 12px}
.abbrbox dl div{display:flex;gap:8px;font-size:13.5px;padding:3px 0;border-bottom:1px dashed var(--line)}
.abbrbox dt{font-weight:700;min-width:62px;color:var(--accent)}.abbrbox dd{margin:0;color:var(--ink-2)}
.abbr-en{display:block;font-size:12px;color:var(--ink-3)}
@media print{.abbrbox{display:block}}
.exadd{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}.exadd .f{flex:1 1 140px;min-width:0;margin:0}.exadd .f input{width:100%;box-sizing:border-box}.exadd .exn{flex:2 1 220px}.exadd .btn{flex:0 0 auto}
.exadd.rep{margin:8px 0;padding:10px;border:1px dashed var(--line);border-radius:8px}
.exnote{margin-top:10px;padding:12px;border:1px dashed var(--warn);border-radius:8px;background:var(--warn-soft);display:flex;flex-direction:column;gap:8px}.exnote textarea{width:100%;box-sizing:border-box;font:inherit}
.extbl textarea{width:100%;border:1px solid transparent;background:transparent;font:inherit;color:inherit;padding:4px 6px;border-radius:6px;resize:vertical;field-sizing:content;min-height:30px}.extbl textarea:hover,.extbl textarea:focus{border-color:var(--line);background:var(--card)}
.exhint{min-height:1em;margin:6px 0 4px;color:var(--ink-2)}
.exlist{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.exitem{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--paper)}
.exhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.exact{margin-left:auto;display:flex;gap:6px}
.btn.sm{padding:5px 10px;font-size:13px}
.extbl{width:100%;border-collapse:collapse;margin-top:8px;font-size:14px}.extbl th{text-align:left;font-size:12px;color:var(--ink-3);font-weight:600;padding:2px 4px}
.extbl td{padding:3px 4px;border-top:1px solid var(--line)}.extbl input{width:100%;border:1px solid transparent;background:transparent;font:inherit;color:inherit;padding:4px 6px;border-radius:6px}
.extbl input:hover,.extbl input:focus{border-color:var(--line);background:var(--card)}
.exx{border:0;background:none;color:var(--crit);cursor:pointer;font-size:15px;padding:4px 8px}

.phbtns{gap:8px;align-items:flex-end;flex-wrap:wrap}.phbtns label.btn{cursor:pointer}.phtype{margin:0;min-width:180px}
.phstat{color:var(--accent);font-weight:600}
.phgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-top:10px}
.phit{margin:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--paper);display:flex;flex-direction:column}
.phthumb{position:relative;border:0;padding:0;background:#111;cursor:zoom-in;aspect-ratio:4/3;display:block;width:100%}
.phthumb img{width:100%;height:100%;object-fit:cover;display:block}
.phloc{position:absolute;left:6px;top:6px;background:var(--warn);color:#fff;font-size:11px;padding:1px 6px;border-radius:6px}
.phit figcaption{display:flex;flex-direction:column;gap:4px;padding:6px}.phit figcaption input,.phit figcaption select{font:inherit;font-size:13px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);width:100%;box-sizing:border-box}
.phdel{align-self:flex-end;border:0;background:none;color:var(--crit);font-size:12.5px;cursor:pointer;padding:2px 4px}
.phlb{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.92);display:flex;flex-direction:column}
.phlb-top{display:flex;justify-content:space-between;align-items:center;color:#fff;padding:10px 14px;font-size:14px}.phlb-top button{background:none;border:0;color:#fff;font-size:24px;cursor:pointer}
.phlb-img{flex:1;display:flex;align-items:center;justify-content:center;overflow:auto;position:relative}.phlb-img img{max-width:100%;max-height:100%;object-fit:contain;touch-action:pinch-zoom}
.phlb-img img.blur{filter:blur(6px)}.phlb-err{position:absolute;bottom:20px;color:#fff;background:rgba(0,0,0,.6);padding:8px 12px;border-radius:8px}
.phlb-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.15);border:0;color:#fff;font-size:36px;width:48px;height:64px;border-radius:8px;cursor:pointer}.phlb-nav.l{left:8px}.phlb-nav.r{right:8px}
.nvform{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}.nvform .f{flex:1 1 140px;margin:0}.nvform .f input{width:100%;box-sizing:border-box}.nvform .nvwhy{flex:3 1 260px}
.nvq{gap:6px;margin-top:8px;align-items:center;flex-wrap:wrap}
.nvup summary{cursor:pointer;list-style:none}.nvup summary::-webkit-details-marker{display:none}
.nvlist{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.nvrow{display:flex;gap:14px;align-items:center;text-align:left;width:100%;border:1px solid var(--line);border-left:4px solid var(--line);border-radius:8px;background:var(--card);padding:8px 12px;cursor:pointer;font:inherit;color:inherit}
.nvrow:hover{background:var(--tint)}.nvrow.crit{border-left-color:var(--crit);background:var(--crit-soft)}.nvrow.warn{border-left-color:var(--warn)}.nvrow.acc{border-left-color:var(--accent)}
.nvd{min-width:110px;display:flex;flex-direction:column}.nvd small,.nvn small{color:var(--ink-3);font-size:12px}.nvn{display:flex;flex-direction:column;gap:2px;align-items:flex-start}
details.acc{border:1px solid var(--line);border-radius:var(--r);background:var(--card);padding:0 14px;margin:8px 0}
details.acc summary{cursor:pointer;padding:11px 0;font-weight:600}
.pill-n{font-family:var(--f-mono);font-size:12px;color:var(--ink-3)}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  nav.side{position:fixed;inset:0 30% 0 0;z-index:40;transform:translateX(-102%);transition:transform .2s;height:100%}
  nav.side.open{transform:none;box-shadow:0 10px 40px rgba(0,0,0,.35)}
  .scrim.on{display:block}

 trigger:[
  "<b>hCG</b>: κλασική επιλογή για φρέσκια μεταφορά. Μακρύς χρόνος ημίσειας ζωής, γι' αυτό αυξάνει τον κίνδυνο OHSS.",
  "<b>Αγωνιστής GnRH</b> (π.χ. τριπτορελίνη 0,2 mg): μόνο σε πρωτόκολλο ανταγωνιστή ή PPOS. Σύντομη αιχμή LH, σχεδόν μηδενικός πρώιμος OHSS. Χρειάζεται freeze-all ή εντατική ωχρινική στήριξη, γιατί το ωχρινικό σωμάτιο υπολειτουργεί.",
  "<b>Διπλό trigger</b> (αγωνιστής + hCG): εξετάζεται όταν υπάρχει ιστορικό χαμηλού ποσοστού ώριμων ωαρίων ή κενών ωοθυλακίων."
 ],

 ],

 principle:[
  "Η E2 προκαλεί υπερπλασία του ενδομητρίου και έκφραση υποδοχέων προγεστερόνης. Η προγεστερόνη ανοίγει το «παράθυρο εμφύτευσης», γι' αυτό η μεταφορά προγραμματίζεται με βάση τις ημέρες έκθεσης στην P4.",
  "Σε ωορρηκτικές γυναίκες, ο ρυθμός ζώσας γέννησης μετά από μία μεταφορά δεν διέφερε μεταξύ φυσικού (37%), τροποποιημένου φυσικού (33%) και τεχνητού κύκλου (34%) {{ho24}}. Η Cochrane του 2025 κρίνει τα στοιχεία αβέβαια για τη σύγκριση φυσικού και ορμονικού κύκλου {{ghobara25}}.",
  "Χωρίς ωχρινικό σωμάτιο λείπουν ορμόνες όπως η ρελαξίνη. Ο φυσικός κύκλος συνδέθηκε με λιγότερες δυσμενείς μαιευτικές εκβάσεις {{zaat23}}, και σε πρόσφατο RCT η καισαρική ήταν συχνότερη μετά τον τεχνητό κύκλο (42,7% έναντι 20,2%) {{geysen26}}."
 ],

function applyAbbr(root){

    if(p.closest("script,style,textarea,abbr,.abbrbox")) return NodeFilter.FILTER_REJECT;
    return NodeFilter.FILTER_ACCEPT;}});
  const nodes=[];while(tw.nextNode()) nodes.push(tw.currentNode);
  nodes.forEach(n=>{const t=n.nodeValue;ABBR_RE.lastIndex=0;if(!ABBR_RE.test(t)) return;
    const inSvg=n.parentElement.closest("svg,button,select,option,.refentry,#abbrTip");ABBR_RE.lastIndex=0;
    if(inSvg){let m;while((m=ABBR_RE.exec(t))) found.add(m[1]);return;}
    const fr=document.createDocumentFragment();let last=0,m;ABBR_RE.lastIndex=0;
    while((m=ABBR_RE.exec(t))){found.add(m[1]);if(m.index>last) fr.appendChild(document.createTextNode(t.slice(last,m.index)));
      const ab=document.createElement("abbr");ab.textContent=m[1];ab.title=abbrText(ABBR_MAP[m[1]]);fr.appendChild(ab);last=m.index+m[1].length;}
    if(last<t.length) fr.appendChild(document.createTextNode(t.slice(last)));n.parentNode.replaceChild(fr,n);});
  if(!found.size) return;
  const list=[...found].sort((a,b)=>a.localeCompare(b,"en",{sensitivity:"base"}));

  box.innerHTML=`<summary>${ABBR_EN()?"Abbreviations on this page":"Συντομογραφίες σε αυτή τη σελίδα"} <span class="chip">${list.length}</span></summary><dl>${list.map(k=>{const a=ABBR_MAP[k];

  root.appendChild(box);
}

  const k=exNorm(name),hit=EXIDX.get(k);const nm=hit?hit[0]:name.trim();

/* ---- Φωτογραφίες ασθενούς: λήψη με κάμερα ή από συλλογή, κρυπτογραφημένο ανέβασμα ---- */
const PH_MAX=1600, PH_THUMB=220, PH_TYPES=["Υπερηχογράφημα","Εξέταση / αποτέλεσμα","Παραπεμπτικό / έγγραφο","Άλλο"];
const PHCACHE={}; let PHPEND={};
function phLoadImg(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{res(im);setTimeout(()=>URL.revokeObjectURL(u),1000);};im.onerror=rej;im.src=u;});}
function phResize(im,max,q){const s=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight)),w=Math.round(im.naturalWidth*s),h=Math.round(im.naturalHeight*s);
  const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);return {u:c.toDataURL("image/jpeg",q),w,h};}
/* local store: IndexedDB */
function phIDB(){return new Promise((res,rej)=>{const r=indexedDB.open("ivfprot-photos",1);r.onupgradeneeded=()=>r.result.createObjectStore("p");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function phIdbPut(k,v){const db=await phIDB();return new Promise((res,rej)=>{const t=db.transaction("p","readwrite");t.objectStore("p").put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error);});}
async function phIdbGet(k){const db=await phIDB();return new Promise((res,rej)=>{const t=db.transaction("p");const r=t.objectStore("p").get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function phIdbDel(k){const db=await phIDB();return new Promise(res=>{const t=db.transaction("p","readwrite");t.objectStore("p").delete(k);t.oncomplete=res;t.onerror=res;});}
const phCloud=()=>MODE==="cloud"&&FS&&USER&&CKEY;
const phDoc=id=>FS.collection("users").doc(USER.uid).collection("photos").doc(id);
async function phStore(id,dataUrl){
  if(phCloud()){await phDoc(id).set({...(await encObj({u:dataUrl})),t:Date.now()});return "cloud";}
  await phIdbPut(id,dataUrl);return "local";}
async function phFetch(ph){
  if(PHCACHE[ph.id]) return PHCACHE[ph.id];
  let u=null;
  if(ph.where==="cloud"){if(!phCloud())throw new Error("locked");const d=await phDoc(ph.id).get();if(!d.exists)throw new Error("missing");u=(await decObj(d.data())).u;}
  else u=await phIdbGet(ph.id);
  if(!u) throw new Error("missing"); PHCACHE[ph.id]=u; return u;}
async function phRemove(ph){delete PHCACHE[ph.id];try{if(ph.where==="cloud"){if(phCloud())await phDoc(ph.id).delete();}else await phIdbDel(ph.id);}catch(e){console.warn(e);}}

async function phAddFiles(key,files,type){
  const [t,id]=key.split(":");
  for(const f of files){
    const pk=uid();PHPEND[pk]={key,msg:"Ανεβαίνει "+(f.name||"φωτογραφία")+"…"};phRerenderKey(key);

function chipLevel(v){const m={"Χαμηλός":"ok","Πολύ χαμηλός":"ok","Ελαχιστοποιημένος":"ok","Χαμηλός (με trigger αγωνιστή)":"ok","Χαμηλός έως μέτριος":"warn","Υψηλότερος":"warn","Κανένας":"ok"};return `<span class="chip ${m[v]||""}">${esc(v)}</span>`;}

function timelineSVG(tl){
  const W=900,lw=150,rh=40,top=10,H=top+tl.rows.length*rh+38;
  const x=d=>lw+ (d-tl.from)/(tl.to-tl.from)*(W-lw-20);
  const col={acc:"var(--accent)",teal:"var(--teal)",ok:"var(--ok)",line:"var(--ink-3)"};
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Χρονοδιάγραμμα πρωτοκόλλου">`;
  tl.ticks.forEach(t=>{s+=`<line x1="${x(t)}" x2="${x(t)}" y1="${top}" y2="${H-30}" stroke="var(--line)"/><text x="${x(t)}" y="${H-14}" font-size="12" text-anchor="middle">${t}</text>`;});
  tl.rows.forEach((r,i)=>{
    const y=top+i*rh;
    s+=`<text x="0" y="${y+24}" font-size="13" font-weight="600" style="fill:var(--ink)">${esc(r.label)}</text>`;
    (r.bars||[]).forEach(b=>{
      const c=col[b.c]||col.acc, w=Math.max(4,x(b.e)-x(b.s));
      s+= b.dash? `<rect x="${x(b.s)}" y="${y+28}" width="${w}" height="5" rx="2" fill="none" stroke="${c}" stroke-dasharray="4 3"/>`
                : `<rect x="${x(b.s)}" y="${y+8}" width="${w}" height="20" rx="4" fill="${c}" opacity=".88"/>`;
      if(b.t) s+=`<text x="${x(b.s)+6}" y="${y+22}" font-size="11.5" style="fill:#fff;font-weight:600">${esc(b.t)}</text>`;
    });
    (r.marks||[]).forEach(d=>{s+=`<circle cx="${x(d)}" cy="${y+18}" r="6" fill="var(--card)" stroke="var(--teal)" stroke-width="2.5"/>`;});
    const evs=(r.events||[]).map(e=>({...e,ex:x(e.d)})).sort((a,b)=>a.ex-b.ex);
    evs.forEach((e,k)=>{
      const ex=e.ex, lw2=Math.max(30,String(e.t||"").length*7+12);
      const prev=evs[k-1], next=evs[k+1];
      const nearNext=next&&next.ex-ex<lw2+14, nearPrev=prev&&ex-prev.ex<lw2+14;
      let anchor="start", tx=ex+10;
      if(ex+lw2>W-10||nearNext){anchor="end";tx=ex-10;}
      if(anchor==="end"&&(ex-lw2<lw||(nearPrev&&nearNext))){anchor="middle";tx=ex;}
      if(anchor==="end"&&nearPrev&&!nearNext){anchor="start";tx=ex+10;}
      const ty=anchor==="middle"?(k%2?y+40:y+4):y+23;
      s+=`<path d="M${ex} ${y+8} l7 10 l-7 10 l-7 -10z" fill="var(--crit)"/>`;
      if(e.t) s+=`<text x="${tx}" y="${ty}" font-size="12" text-anchor="${anchor}" style="fill:var(--ink);font-weight:600;paint-order:stroke;stroke:var(--card);stroke-width:3px">${esc(e.t)}</text>`;
    });
  });

function bindTools(){
  const v=id=>parseFloat($(id).value);
  const dose=()=>{
    const age=v("#d_age"),amh=v("#d_amh"),afc=v("#d_afc"),bmi=v("#d_bmi"),prev=$("#d_prev").value;
    let cls="φυσιολογική",rng="150 IU/ημ",note="Η Cochrane δεν βρήκε όφελος από αύξηση πάνω από τα 150 IU σε φυσιολογικές απαντήτριες.",chip="ok";
    const low=(amh<1.2)||(afc<5), high=(afc>18)||(amh>3.5);
    if(prev==="high"||(high&&!low)){cls="υψηλή";rng="100–150 IU/ημ";chip="warn";note="Η μικρότερη δόση μειώνει τον μέτριο ή σοβαρό OHSS. Πρωτόκολλο ανταγωνιστή ή PPOS, ώστε να μπορεί να γίνει trigger με αγωνιστή.";}
    else if(low||prev==="low"){cls="χαμηλή";rng="150–300 IU/ημ";chip="crit";note="Η αύξηση πάνω από 150 IU δεν έχει σαφές όφελος στις γεννήσεις· μην ξεπερνάς τα 300 IU/ημ. Δες «Χαμηλές απαντήτριες (POSEIDON)».";}
    else if(prev==="sub"){cls="υποβέλτιστη (POSEIDON 1–2)";rng="150–225 IU/ημ ± LH";chip="warn";note="Σκέψου αύξηση δόσης ή προσθήκη LH δραστικότητας, ιδίως ≥ 35 ετών.";}
    const extra=[]; if(age>=35&&cls==="φυσιολογική")extra.push("Ηλικία ≥ 35: πολλοί κλινικοί ξεκινούν στο πάνω όριο του εύρους.");
    if(bmi>=30)extra.push("ΔΜΣ ≥ 30: η απάντηση μπορεί να είναι πιο αργή· τιτλοποίησε στην Η5–6.");
    $("#d_out").innerHTML=`<div class="alert ${chip==="crit"?"crit":chip==="warn"?"warn":"ok"}"><span class="dot"></span><div><b>Αναμενόμενη απάντηση: ${cls} · ${rng}</b><span class="small">${note} ${extra.join(" ")}</span></div></div>`;
  };
  const fort=()=>{
    const afc=v("#f_afc2"),pfc=v("#f_pfc"),ooc=v("#f_ooc");
    if(!(afc>0)){$("#f_out").innerHTML='<p class="small">Συμπλήρωσε το AFC.</p>';return;}
    const F=pfc*100/afc,O=ooc*100/afc;
    const ft=isNaN(F)?"–":F<42?"χαμηλό τριτημόριο":F<=58?"μέσο τριτημόριο":"υψηλό τριτημόριο";
    $("#f_out").innerHTML=`<div class="kpis"><div class="kpi"><div class="v">${isNaN(F)?"–":F.toFixed(0)+"%"}</div><div class="l">FORT · ${ft}</div></div><div class="kpi"><div class="v">${isNaN(O)?"–":O.toFixed(0)+"%"}</div><div class="l">FOI${!isNaN(O)&&O<50?" · πιθανή υπο-απάντηση":""}</div></div></div>`;
  };
  const dates=()=>{
    const k=$("#t_kind").value,d=$("#t_date").value; if(!d){$("#t_out").innerHTML='<p class="small muted">Διάλεξε ημερομηνία.</p>';return;}
    const m={p:[["Έμβρυο Η3",3],["Βλαστοκύστη",5]],lh:[["Έμβρυο Η3",4],["Βλαστοκύστη",6]],hcg:[["Έμβρυο Η3",5],["Βλαστοκύστη",7]],opu:[["Έμβρυο Η3",3],["Βλαστοκύστη",5]]}[k];
    const fmt=s=>new Date(s+"T12:00:00").toLocaleDateString("el-GR",{weekday:"long",day:"numeric",month:"long"});
    $("#t_out").innerHTML=m.map(([l,n])=>`<p style="margin:4px 0"><b>${l}:</b> ${fmt(isoAdd(d,n))}</p>`).join("")+`<p class="small muted">βhCG ορού για βλαστοκύστη: ${fmt(isoAdd(d,m[1][1]+9))} – ${fmt(isoAdd(d,m[1][1]+11))}</p>`;
  };
  const units=()=>{const f={e2:[3.671,"pmol/L","pg/mL"],p4:[3.18,"nmol/L","ng/mL"],amh:[7.14,"pmol/L","ng/mL"]}[$("#u_kind").value];const x=v("#u_val");$("#u_out").innerHTML=isNaN(x)?"":`<p><b>${x} ${f[2]}</b> = ${(x*f[0]).toFixed(2)} ${f[1]}</p><p class="small muted">${x} ${f[1]} = ${(x/f[0]).toFixed(2)} ${f[2]}</p>`;};
  ["#d_age","#d_amh","#d_afc","#d_bmi","#d_prev"].forEach(i=>$(i).oninput=$(i).onchange=dose);
  ["#f_afc2","#f_pfc","#f_ooc"].forEach(i=>$(i).oninput=fort);
  $("#t_date").value=today(); ["#t_kind","#t_date"].forEach(i=>$(i).onchange=dates);
  ["#u_kind","#u_val"].forEach(i=>$(i).oninput=$(i).onchange=units);
  dose();fort();dates();units();
}

/* ================= QUIZ ================= */
let QZ={list:[],i:0,score:0,answered:false,filter:"all"};
function quizStart(f){const L=QUIZ.filter(q=>f==="all"||q.p===f);for(let i=L.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[L[i],L[j]]=[L[j],L[i]];}QZ={list:L,i:0,score:0,answered:false,filter:f};}
function pageQuiz(){
  if(!QZ.list.length) quizStart(QZ.filter||"all");
  const opts=[["all","Όλα τα θέματα ("+QUIZ.length+")"],...PROTOCOLS.filter(p=>QUIZ.some(q=>q.p===p.id)).map(p=>[p.id,p.name]),["lab","Εργαστήριο και add-ons"],["tools","Εργαλεία"]];
  const head=`<h1>Quiz</h1><p class="lede">Έλεγξε τις γνώσεις σου. Κάθε απάντηση συνοδεύεται από εξήγηση βασισμένη στο περιεχόμενο του οδηγού.</p>
  <label class="f" for="qzF" style="max-width:360px;margin-bottom:14px">Θέμα<select id="qzF">${opts.map(([k,t])=>`<option value="${k}"${QZ.filter===k?" selected":""}>${esc(t)}</option>`).join("")}</select></label>`;
  if(QZ.i>=QZ.list.length) return head+`<div class="card"><h3>Τέλος</h3><p>Σκορ: <b class="mono">${QZ.score} / ${QZ.list.length}</b> (${Math.round(QZ.score/QZ.list.length*100)}%)</p><button class="btn pri" id="qzAgain">Ξανά</button></div>`;
  const q=QZ.list[QZ.i];
  return head+`<div class="card"><p class="small muted">Ερώτηση ${QZ.i+1} από ${QZ.list.length} · Σκορ ${QZ.score}${PROTO_BY_ID[q.p]?` · <a href="#p-${q.p}">${esc(PROTO_BY_ID[q.p].name)}</a>`:""}</p>
   <h3>${esc(q.q)}</h3><div style="display:flex;flex-direction:column;gap:8px">${q.o.map((o,k)=>`<button class="pt" data-qa="${k}" style="cursor:pointer">${String.fromCharCode(913+k)}. ${esc(o)}</button>`).join("")}</div>
   <div id="qzFb" style="margin-top:12px"></div></div>`;
}
function bindQuiz(){
  $("#qzF").onchange=e=>{quizStart(e.target.value);refreshQuiz();};
  const ag=$("#qzAgain"); if(ag) ag.onclick=()=>{quizStart(QZ.filter);refreshQuiz();};
  document.querySelectorAll("[data-qa]").forEach(b=>b.onclick=()=>{
    if(QZ.answered) return; QZ.answered=true;
    const q=QZ.list[QZ.i],k=+b.dataset.qa,ok=k===q.a; if(ok)QZ.score++;
    document.querySelectorAll("[data-qa]").forEach(x=>{const i=+x.dataset.qa;if(i===q.a){x.style.borderColor="var(--ok)";x.style.background="var(--ok-soft)";}else if(i===k){x.style.borderColor="var(--crit)";x.style.background="var(--crit-soft)";}});
    $("#qzFb").innerHTML=`<div class="alert ${ok?"ok":"crit"}"><span class="dot"></span><div><b>${ok?"Σωστά.":"Όχι ακριβώς."}</b><span class="small">${esc(q.ex)}</span></div></div><button class="btn pri" id="qzNext">${QZ.i+1<QZ.list.length?"Επόμενη":"Αποτέλεσμα"}</button>`;
    $("#qzNext").onclick=()=>{QZ.i++;QZ.answered=false;refreshQuiz();};
  });
}
function refreshQuiz(){$("#view").innerHTML=pageQuiz();bindQuiz();}

/* ---------- Κρυπτογράφηση (AES-GCM 256, κλειδί από PBKDF2-SHA256) ---------- */
const TE=new TextEncoder(), TD=new TextDecoder();
const b64=buf=>{const u=new Uint8Array(buf);let s="";for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s);};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function deriveKey(pass,salt,iter){
  const base=await crypto.subtle.importKey("raw",TE.encode(pass),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
}
async function encObj(obj,key=CKEY){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},key,TE.encode(JSON.stringify(obj)));return {iv:b64(iv),ct:b64(ct)};}
async function decObj(o,key=CKEY){const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(o.iv)},key,unb64(o.ct));return JSON.parse(TD.decode(pt));}

async function setupPass(p1){

  const key=await deriveKey(p1,salt,KDF_ITER);

  const cfgEnc=await encObj({...DEFCFG},key);
  const meta={salt:b64(salt),iter:KDF_ITER,kdf:"PBKDF2-SHA256",cipher:"AES-GCM-256",verifier,cfgEnc,created:firebase.firestore.FieldValue.serverTimestamp()};
  await FS.collection("users").doc(USER.uid).set(meta);
  USERMETA=meta; CKEY=key; await loadCloud();
}
async function unlock(pass){
  const key=await deriveKey(pass,unb64(USERMETA.salt),USERMETA.iter||KDF_ITER);
  try{const v=await decObj(USERMETA.verifier,key);if(v.check!=="ivfprot-ok")throw 0;}catch(e){return false;}
  CKEY=key; await loadCloud(); return true;
}

function addCardFor(t,id,nt){

const GYN_CX=["","Τεστ Παπ","HPV-DNA","Συνεξέταση (Παπ + HPV)"];
function gyById(id){return (DB.gyn||[]).find(x=>x.id===id);}
function gyFirstVisit(d){return {id:uid(),d:d||today(),reason:"Πρώτη επίσκεψη (άνοιγμα φακέλου)",exam:"",us:"",dx:"",next:"",plan:""};}
function gyNew(name){const n={id:uid(),created:new Date().toISOString().slice(0,10),info:{name:name||"",dob:"",amka:"",phone:"",notes:""},hist:{},scr:{},visits:[gyFirstVisit()]};(DB.gyn=DB.gyn||[]).unshift(n);save();return n;}
function gyAge(p){const d=p.info&&p.info.dob;if(!d)return null;const b=new Date(d),t=new Date();let a=t.getFullYear()-b.getFullYear();if(t<new Date(t.getFullYear(),b.getMonth(),b.getDate()))a--;return a>=0&&a<120?a:null;}
function gyAddY(d,y){const x=new Date(d);x.setFullYear(x.getFullYear()+y);return x.toISOString().slice(0,10);}
function gyFmtD(d){if(!d)return "";const [y,m,dd]=d.split("-");return `${dd}/${m}/${y}`;}
function gyLastVisit(p){return [...(p.visits||[])].sort((a,b)=>(b.d||"").localeCompare(a.d||""))[0];}
function gyAlerts(p){
  const A=[],age=gyAge(p),today=new Date().toISOString().slice(0,10),s=p.scr||{};
  if(age!==null&&age>=21&&age<=65){
    const iv=age<30?3:5, lab=age<30?"Τεστ Παπ ανά 3 έτη (21–29)":"HPV-DNA ανά 5 έτη (30–65)";
    if(!s.cx_d) A.push(["warn","Τραχηλικός έλεγχος: δεν έχει καταγραφεί",lab+". Καταχώρισε την τελευταία εξέταση στον «Προληπτικό έλεγχο»."]);
    else{const due=gyAddY(s.cx_d,iv);if(due<=today)A.push(["crit","Τραχηλικός έλεγχος: εκπρόθεσμος από "+gyFmtD(due),lab+"."]);else A.push(["ok","Επόμενος τραχηλικός έλεγχος: "+gyFmtD(due),lab+"."]);}
  }
  if(s.cx_res&&/ASC|LSIL|HSIL|AGC|θετικ|CIN|16|18/i.test(s.cx_res)) A.push(["crit","Παθολογικό αποτέλεσμα τραχηλικού ελέγχου","«"+s.cx_res+"». Ο χρόνος επανελέγχου ορίζεται από τον αλγόριθμο διαχείρισης, όχι από το πρόγραμμα ρουτίνας."]);
  if(age!==null&&age>=50&&age<=69){
    if(!s.mmg_d) A.push(["warn","Μαστογραφία: δεν έχει καταγραφεί","Ενδεικτικά ανά 2 έτη στις 50–69 (Προλαμβάνω)."]);
    else{const due=gyAddY(s.mmg_d,2);A.push(due<=today?["crit","Μαστογραφία: εκπρόθεσμη από "+gyFmtD(due),"Ενδεικτικά ανά 2 έτη στις 50–69."]:["ok","Επόμενη μαστογραφία: "+gyFmtD(due),"Ενδεικτικά ανά 2 έτη στις 50–69."]);}
  }
  const lv=gyLastVisit(p);
  if(lv&&lv.next){A.push(lv.next<today?["crit","Επανεξέταση εκπρόθεσμη ("+gyFmtD(lv.next)+")",lv.plan||""]:["ok","Επόμενη επανεξέταση: "+gyFmtD(lv.next),lv.plan||""]);}
  if((p.hist||{}).allergy) A.push(["warn","Αλλεργίες: "+p.hist.allergy,""]);
  return A;
}

function gyBind(id){
  const p=gyById(id);if(!p)return;
  document.querySelectorAll("[data-gf]").forEach(el=>el.onchange=()=>{const [a,b]=el.dataset.gf.split(".");p[a]=p[a]||{};p[a][b]=el.value.trim();save();if(/dob|cx_|mmg_|name|allergy/.test(b))gyRender();});
  $("#gyAddV").onclick=()=>gyVisitForm(p);
  document.querySelectorAll("[data-gyv]").forEach(b=>b.onclick=()=>gyVisitForm(p,p.visits.find(v=>v.id===b.dataset.gyv)));
  $("#gyPrint").onclick=()=>window.print();
  $("#gyDel").onclick=()=>{openDlg(`<h3 style="margin-top:0">Διαγραφή καρτέλας</h3><p>Να διαγραφεί οριστικά η γυναικολογική καρτέλα <b>${esc(p.info.name||"χωρίς όνομα")}</b> με όλες τις επισκέψεις;</p><div class="row" style="justify-content:flex-end"><button class="btn" onclick="closeDlg()">Ακύρωση</button><button class="btn pri" id="dGo">Διαγραφή</button></div>`);$("#dGo").onclick=()=>{DB.gyn=DB.gyn.filter(x=>x.id!==p.id);save();closeDlg();location.hash="tracker";};};
}
/* ================= ΕΚΚΙΝΗΣΗ ================= */
loadLocal();
renderAcct();
initFirebase();
$("#dlg").addEventListener("click",e=>{if(e.target.id==="dlg")closeDlg();});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDlg();});
function setNav(o){$("#side").classList.toggle("open",o);$("#scrim").classList.toggle("on",o);document.body.style.overflow=o?"hidden":"";if(o&&typeof gisMount==="function")setTimeout(gisMount,250);}
$("#menuBtn").onclick=()=>setNav(!$("#side").classList.contains("open"));
$("#scrim").onclick=()=>setNav(false);
$("#navClose").onclick=()=>setNav(false);
$("#side").addEventListener("click",e=>{if(e.target.closest("a[href^='#']"))setNav(false);});
let NAVSTACK=0;window.addEventListener("hashchange",()=>{NAVSTACK++;});
function goBack(){if(NAVSTACK>0&&history.length>1){NAVSTACK-=2;history.back();}else location.hash="home";}
$("#backBtn").onclick=goBack;$("#backDesk").onclick=goBack;
window.addEventListener("hashchange",route);
route();
/* έλεγχος νέας έκδοσης */
const BUILD="1795869134";
async function checkUpdate(){try{const r=await fetch(location.pathname+"?u="+Date.now(),{cache:"no-store"});const h=await r.text();const m=h.match(/const BUILD="(\d+)"/);if(m&&m[1]!==BUILD&&!$("#updBar")){const d=document.createElement("div");d.id="updBar";d.style.cssText="position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:60;background:var(--accent);color:#fff;padding:10px 14px;border-radius:999px;box-shadow:0 6px 24px rgba(0,0,0,.3);display:flex;gap:10px;align-items:center;font-size:14px";d.innerHTML='Υπάρχει νέα έκδοση <button class="btn sm" onclick="location.reload()">Ανανέωση</button>';document.body.appendChild(d);}}catch(e){}}
setTimeout(checkUpdate,3000);setInterval(checkUpdate,10*60*1000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)checkUpdate();});
</script>
