<style>
/* Layout: fixed side navigation + main reading column; tables scroll horizontally */
:root{
  --ink:#16222e; --ink-2:#44525f; --ink-3:#6c7884;
  --paper:#f6f7f8; --card:#ffffff; --line:#dde2e7; --tint:#eef2f4;
  --accent:#7a2e5c; --accent-soft:#f4e8ef; --teal:#1f6f78; --teal-soft:#e3f1f2;
  --ok:#2d7a46; --ok-soft:#e5f3e9; --warn:#a46200; --warn-soft:#fbf0dc; --crit:#b3261e; --crit-soft:#fbe7e5;
  --f-display:"Literata",Georgia,"Times New Roman",serif;
  --f-body:"Commissioner","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:8px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ink:#e6ebef; --ink-2:#b5bfc8; --ink-3:#8b96a1; --paper:#11171d; --card:#18212a; --line:#2b3741; --tint:#1e2832;
  --accent:#e59ac4; --accent-soft:#3a2231; --teal:#6cc3cb; --teal-soft:#183338;
  --ok:#73c48d; --ok-soft:#183324; --warn:#f0b35a; --warn-soft:#3a2c14; --crit:#ff8a80; --crit-soft:#3d1c1a; color-scheme:dark;}}
:root[data-theme="dark"]{
  --ink:#e6ebef; --ink-2:#b5bfc8; --ink-3:#8b96a1; --paper:#11171d; --card:#18212a; --line:#2b3741; --tint:#1e2832;
  --accent:#e59ac4; --accent-soft:#3a2231; --teal:#6cc3cb; --teal-soft:#183338;
  --ok:#73c48d; --ok-soft:#183324; --warn:#f0b35a; --warn-soft:#3a2c14; --crit:#ff8a80; --crit-soft:#3d1c1a; color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font:15.5px/1.6 var(--f-body);}
a{color:var(--teal)}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100%}
nav.side{background:var(--card);border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{font-family:var(--f-display);font-weight:650;font-size:20px;line-height:1.2;margin:0 6px 4px}
/*brand*/
.brandlink{display:flex;align-items:center;gap:11px;text-decoration:none;color:inherit;margin:0 6px 8px}
.brandlink .mark{width:46px;height:46px;flex:0 0 46px;border-radius:12px;box-shadow:0 2px 8px rgba(122,46,92,.25)}
.brandlink .brand{display:block;margin:0;font-size:21px;line-height:1.1}
.brand-kicker{display:block;font:600 10.5px/1.4 var(--f-body);letter-spacing:.22em;color:var(--teal);margin-top:2px}
.brandlink.sm{margin:0}.brandlink.sm .mark{width:32px;height:32px;flex-basis:32px;border-radius:8px}.brandlink.sm .brand{font-size:17px}.brandlink.sm .brand-kicker{font-size:9px}
.langsw{margin:-8px 6px 14px}.langsw a{font-size:13px;font-weight:600;color:var(--teal);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:3px 10px}.langsw a:hover{border-color:var(--teal)}
.brand-sub{color:var(--ink-3);font-size:12.5px;margin:0 6px 18px}
.navgrp{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:16px 8px 6px}
.navlink{display:block;padding:7px 10px;border-radius:6px;color:var(--ink-2);text-decoration:none;font-size:14.5px}
.navlink:hover{background:var(--tint);color:var(--ink)}
.navlink.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
details.navdd{margin:2px 0}
details.navdd>summary{list-style:none;display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border-radius:6px;cursor:pointer;color:var(--ink-2);font-size:14.5px;margin-left:12px}
details.navdd>summary::-webkit-details-marker{display:none}
details.navdd>summary::before{content:"▸";font-size:11px;margin-right:8px;color:var(--ink-3);transition:transform .15s}
details.navdd[open]>summary::before{transform:rotate(90deg)}
details.navdd>summary:hover{background:var(--tint);color:var(--ink)}
details.navdd>summary .pill-n{margin-left:auto}
details.navdd .navlink.sub{padding-left:34px}
.navsub{font-size:11.5px;color:var(--ink-3);margin:8px 10px 2px 22px;font-weight:600}
.navlink.sub{padding-left:22px;font-size:14px}
main{padding:28px clamp(16px,4vw,48px) 80px;max-width:1180px;width:100%}
h1,h2,h3{font-family:var(--f-display);font-weight:650;text-wrap:balance;line-height:1.25}
h1{font-size:30px;margin:0 0 6px} h2{font-size:22px;margin:34px 0 10px} h3{font-size:17.5px;margin:22px 0 8px}
.lede{color:var(--ink-2);max-width:72ch;margin:0 0 18px}
p,li{max-width:78ch}
.muted{color:var(--ink-3)}
.small{font-size:13px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
td.mono{white-space:nowrap}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.card h3{margin-top:0}
a.card{text-decoration:none;color:inherit;display:block;transition:border-color .15s}
a.card:hover{border-color:var(--accent)}
.chip{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--tint);color:var(--ink-2);margin:0 4px 4px 0;white-space:nowrap}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.chip.teal{background:var(--teal-soft);color:var(--teal)}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.crit{background:var(--crit-soft);color:var(--crit)}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card);margin:10px 0 6px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 11px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
th{background:var(--tint);font-weight:600;color:var(--ink-2);font-size:12.5px;letter-spacing:.02em;white-space:nowrap}
tr:last-child td{border-bottom:none}
td.when{white-space:nowrap;font-weight:600;color:var(--accent)}
td .drug{font-weight:600}
.callout{border-left:4px solid var(--teal);background:var(--teal-soft);padding:10px 14px;border-radius:0 var(--r) var(--r) 0;margin:12px 0}
.callout.warn{border-color:var(--warn);background:var(--warn-soft)}
.callout.crit{border-color:var(--crit);background:var(--crit-soft)}
.callout.acc{border-color:var(--accent);background:var(--accent-soft)}
.callout p{margin:4px 0}
.cite{color:var(--teal);text-decoration:none;border-bottom:1px dotted var(--teal)}
.reflist li{margin-bottom:8px;padding-left:2em;text-indent:-2em;list-style:none}
.reflist{padding-left:0}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:14px 0 16px}
.tab{background:none;border:none;border-bottom:2px solid transparent;padding:8px 12px;font:inherit;color:var(--ink-2);cursor:pointer}
.tab.on{border-color:var(--accent);color:var(--accent);font-weight:600}
.timeline{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.timeline svg{display:block;min-width:640px;width:100%;height:auto}
.timeline text{font-family:var(--f-body);fill:var(--ink-2)}
.btn{font:inherit;font-size:14px;padding:8px 14px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.pri{color:#1a0f15}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.pri{color:#1a0f15}}
.btn.danger{color:var(--crit)}
.btn.sm{padding:4px 10px;font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--ink-2);font-weight:500}
input,select,textarea{font:inherit;font-size:14.5px;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);min-width:0}
textarea{width:100%;min-height:90px;font-family:var(--f-mono);font-size:12.5px}
.form{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.form .wide{grid-column:span 2}
.pt-list{display:flex;flex-direction:column;gap:6px}
.pt{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:9px 11px;border:1px solid var(--line);border-radius:6px;background:var(--card);cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.pt.on{border-color:var(--accent);background:var(--accent-soft)}
.trk{display:grid;grid-template-columns:240px minmax(0,1fr);gap:18px;align-items:start}
.trk>*{min-width:0}
main{min-width:0}
.alert{display:flex;gap:10px;padding:10px 12px;border-radius:6px;margin-bottom:8px;border:1px solid var(--line);background:var(--card)}
.alert .dot{flex:0 0 8px;border-radius:4px}
.alert.crit .dot{background:var(--crit)} .alert.warn .dot{background:var(--warn)} .alert.ok .dot{background:var(--ok)} .alert.info .dot{background:var(--teal)}
.alert b{display:block}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:10px 0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.kpi .v{font-family:var(--f-mono);font-size:22px;font-weight:600}
.kpi .l{font-size:12px;color:var(--ink-3)}
.bins{display:flex;gap:4px;align-items:flex-end;height:60px}
.dialog-bg{position:fixed;inset:0;background:rgba(10,15,20,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.dialog-bg.on{display:flex}
.dialog{background:var(--card);border-radius:10px;padding:20px;max-width:520px;width:100%;border:1px solid var(--line)}
.topbar{display:none}
details.acc{border:1px solid var(--line);border-radius:var(--r);background:var(--card);padding:0 14px;margin:8px 0}
details.acc summary{cursor:pointer;padding:11px 0;font-weight:600}
.pill-n{font-family:var(--f-mono);font-size:12px;color:var(--ink-3)}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  nav.side{position:fixed;inset:0 30% 0 0;z-index:40;transform:translateX(-102%);transition:transform .2s;height:100%}
  nav.side.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.35)}
  .topbar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
  .trk{grid-template-columns:1fr}
  .form .wide{grid-column:auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function cite(txt){
  return String(txt).replace(/\{\{([^}]+)\}\}/g,(m,keys)=>{
    const parts = keys.split(";").map(k=>k.trim()).filter(k=>REFS[k]);
    return "(" + parts.map(k=>`<a class="cite" href="#refs" title="${esc(REFS[k].apa.replace(/<[^>]+>/g,""))}">${esc(REFS[k].cite)}</a>`).join("; ") + ")";
  });
}
function refItem(k){const r=REFS[k];return `<li>${r.apa} <a href="https://doi.org/${r.doi}" target="_blank" rel="noopener">https://doi.org/${r.doi}</a></li>`;}
function sortedRefKeys(keys){return [...new Set(keys)].sort((a,b)=>REFS[a].apa.replace(/<[^>]+>/g,"").localeCompare(REFS[b].apa.replace(/<[^>]+>/g,""),"en"));}
const PROTO_BY_ID = Object.fromEntries(PROTOCOLS.map(p=>[p.id,p]));

    return `<details class="navdd" data-dd="${cat}"${open?" open":""}><summary>${title}<span class="pill-n">${items.length}</span></summary>${items.map(p=>L("p-"+p.id,navName(p),1)).join("")}</details>`;};

const NAVN={"antagonist":"GnRH antagonist","long-agonist":"Long agonist","flare":"Short (flare)","ultra-long":"Ultra-long","ppos":"PPOS","mild":"Mild / natural IVF","duostim":"DuoStim","fp-random":"Fertility preservation","ivm":"IVM","poseidon":"Low responders","ohss":"High responders / OHSS","fet-hrt":"HRT cycle","fet-nc":"Natural cycle","fet-letrozole":"Letrozole","fet-donor":"Oocyte recipient","sp-endo":"Endometriosis","sp-hydro":"Hydrosalpinx","sp-rif":"Implantation failure (RIF)","sp-male":"Male factor / ICSI","sp-thromb":"Thrombophilia / heparin"};
function navName(p){return NAVN[p.id]||p.name;}
function route(){
  const h=(location.hash||"#home").slice(1);
  $("#navlinks").innerHTML=navHTML(h);
  document.querySelectorAll("details.navdd").forEach(d=>d.addEventListener("toggle",()=>{NAVOPEN[d.dataset.dd]=d.open;}));
  $("#side").classList.remove("open");
  const v=$("#view");
  if(h==="protocols") v.innerHTML=pageProtocols();
  else if(h.startsWith("p-") && PROTO_BY_ID[h.slice(2)]) v.innerHTML=pageProtocol(PROTO_BY_ID[h.slice(2)]);
  else if(h==="drugs") v.innerHTML=pageDrugs();
  else if(h==="studies") v.innerHTML=pageStudies("all");
  else if(h==="tracker") {v.innerHTML=pageTracker(); bindTracker();}
  else if((h==="preg"||h.startsWith("k-"))&&typeof pagePreg==="function") {v.innerHTML=pagePreg(); pgBind();}
  else if(h==="refs") v.innerHTML=pageRefs();
  else if(h==="about") v.innerHTML=pageAbout();
  else if(h==="tools") {v.innerHTML=pageTools(); bindTools();}
  else if(h==="quiz") {v.innerHTML=pageQuiz(); bindQuiz();}
  else if(h==="terms") v.innerHTML=pageTerms();
  else if(h==="author") v.innerHTML=pageAuthor();
  else v.innerHTML=pageHome();
  window.scrollTo(0,0);
}

function chipLevel(v){const m={"Low":"ok","Very low":"ok","Minimised":"ok","Low (with agonist trigger)":"ok","Low to moderate":"warn","Higher":"warn","None":"ok"};return `<span class="chip ${m[v]||""}">${esc(v)}</span>`;}

function timelineSVG(tl){
  const W=900,lw=150,rh=40,top=10,H=top+tl.rows.length*rh+38;
  const x=d=>lw+ (d-tl.from)/(tl.to-tl.from)*(W-lw-20);
  const col={acc:"var(--accent)",teal:"var(--teal)",ok:"var(--ok)",line:"var(--ink-3)"};
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Protocol timeline">`;
  tl.ticks.forEach(t=>{s+=`<line x1="${x(t)}" x2="${x(t)}" y1="${top}" y2="${H-30}" stroke="var(--line)"/><text x="${x(t)}" y="${H-14}" font-size="12" text-anchor="middle">${t}</text>`;});
  tl.rows.forEach((r,i)=>{
    const y=top+i*rh;
    s+=`<text x="0" y="${y+24}" font-size="13" font-weight="600" style="fill:var(--ink)">${esc(r.label)}</text>`;
    (r.bars||[]).forEach(b=>{
      const c=col[b.c]||col.acc, w=Math.max(4,x(b.e)-x(b.s));
      s+= b.dash? `<rect x="${x(b.s)}" y="${y+28}" width="${w}" height="5" rx="2" fill="none" stroke="${c}" stroke-dasharray="4 3"/>`
                : `<rect x="${x(b.s)}" y="${y+8}" width="${w}" height="20" rx="4" fill="${c}" opacity=".88"/>`;
      if(b.t) s+=`<text x="${x(b.s)+6}" y="${y+22}" font-size="11.5" style="fill:#fff;font-weight:600">${esc(b.t)}</text>`;
    });
    (r.marks||[]).forEach(d=>{s+=`<circle cx="${x(d)}" cy="${y+18}" r="6" fill="var(--card)" stroke="var(--teal)" stroke-width="2.5"/>`;});
    (r.events||[]).forEach(e=>{const ex=x(e.d),left=ex>W-150;s+=`<path d="M${ex} ${y+8} l7 10 l-7 10 l-7 -10z" fill="var(--crit)"/><text x="${left?ex-10:ex+10}" y="${y+23}" font-size="12" text-anchor="${left?"end":"start"}" style="fill:var(--ink);font-weight:600">${esc(e.t)}</text>`;});
  });
  s+=`<text x="${lw}" y="${H-1}" font-size="11.5" style="fill:var(--ink-3)">${esc(tl.axis)}</text></svg>`;
  return s;
}

/* ---------- Encryption (AES-GCM 256, key from PBKDF2-SHA256) ---------- */
const TE=new TextEncoder(), TD=new TextDecoder();
const b64=buf=>{const u=new Uint8Array(buf);let s="";for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s);};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function deriveKey(pass,salt,iter){
  const base=await crypto.subtle.importKey("raw",TE.encode(pass),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
}
async function encObj(obj,key=CKEY){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},key,TE.encode(JSON.stringify(obj)));return {iv:b64(iv),ct:b64(ct)};}
async function decObj(o,key=CKEY){const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(o.iv)},key,unb64(o.ct));return JSON.parse(TD.decode(pt));}

  if(MODE==="local") return `<div class="callout ${STORAGE_OK?"":"crit"}"><p>${STORAGE_OK?"<b>Local mode:</b> data are stored only in this browser. "+(FB_OK?"For encrypted folders you can open on any device, sign in with Google.</p><p style=\"margin-top:8px\"><div style=\"max-width:320px\">"+gisHTML("gisTrk")+emailHTML("t")+"</div><span class=\"small\" id=\"acctMsg2\" style=\"color:var(--crit)\"></span>":""):"Local storage is not available. Changes will be lost when the page closes."}</p></div>`;
  return `<div class="callout acc"><p><b>Encrypted folders:</b> data are encrypted on this device with your passphrase before being sent to Firebase (EU, Frankfurt). No one else, neither the administrator nor Google, can read them. <span class="muted" id="syncMsg">${esc(SYNC)}</span></p></div>`;
}
function pageTracker(){
  if(MODE==="cloud-wait") return `<h1>Patient folders</h1><p class="muted">Signing in…</p>`;
  if(MODE==="cloud-locked") return `<h1>Patient folders</h1>${USERMETA?unlockHTML():setupHTML()}`;
  const p=DB.patients.find(x=>x.id===CUR)||DB.patients[0]; if(p) CUR=p.id;
  const localImport=MODE==="cloud"?(readLocal()||{patients:[]}).patients.filter(x=>!x.example):[];
  return `<h1>Patient folders</h1>${trackerBanner()}
  ${localImport.length?`<div class="callout warn"><p>Found <b>${localImport.length}</b> folders saved only on this device. <button class="btn sm" id="impLocal">Move to my account</button></p></div>`:""}
  <div class="trk">
   <div>
    <div class="row" style="margin-bottom:10px"><button class="btn pri" id="newPt">+ New patient</button><button class="btn" id="cfgBtn">Thresholds</button></div>
    <input id="ptSearch" placeholder="Search code" style="width:100%;margin-bottom:8px" aria-label="Search patient code">
    <div class="pt-list" id="ptList">${ptListHTML("")}</div>
    <div class="row" style="margin-top:14px"><button class="btn sm" id="bkCopy">Copy backup</button><button class="btn sm" id="bkRestore">Restore</button></div>
    <p class="small muted" id="bkMsg"></p>
   </div>
   <div id="ptPane">${p?ptPane(p):`<div class="card"><h3>No folders yet</h3><p class="small">Press “New patient” to create the first folder. Use a code instead of a full name.</p></div>`}</div>
  </div>`;
}
function ptListHTML(q){
  const L=DB.patients.filter(x=>!q||(x.code||"").toLowerCase().includes(q.toLowerCase()));
  return L.map(x=>{const c=x.cycles[x.cycles.length-1];return `<button class="pt${x.id===CUR?" on":""}" data-pt="${x.id}"><span><b>${esc(x.code||"no code")}</b><br><span class="small muted">${esc(c?((PROTO_OPTS.find(o=>o[0]===c.proto)||[])[1]||""):"")}</span></span><span class="pill-n">${x.cycles.length} cycles</span></button>`;}).join("")||`<p class="muted small">No folders.</p>`;
}
function setupHTML(){
  return `<div class="card" style="max-width:560px"><h3>Create an encryption passphrase</h3>
  <p class="small">Your patient folders are encrypted with this passphrase before leaving the device. It is not stored anywhere.</p>
  <div class="callout crit"><p class="small"><b>If you forget it, the data cannot be recovered in any way.</b> Keep it in a password manager.</p></div>
  <div class="form" style="grid-template-columns:1fr"><label class="f" for="pw1">Passphrase (at least 10 characters)<input id="pw1" type="password" autocomplete="new-password"></label>
  <label class="f" for="pw2">Repeat<input id="pw2" type="password" autocomplete="new-password"></label></div>
  <p class="small" id="pwMsg" style="color:var(--crit)"></p><button class="btn pri" id="pwGo">Create and unlock</button></div>`;
}
function unlockHTML(){
  return `<div class="card" style="max-width:520px"><h3>Unlock folders</h3><p class="small">Signed in as <b>${esc(USER.email||"")}</b>. Enter your encryption passphrase.</p>
  <label class="f" for="pwU">Passphrase<input id="pwU" type="password" autocomplete="current-password"></label>
  <p class="small" id="pwMsg" style="color:var(--crit)"></p><button class="btn pri" id="pwGo">Unlock</button>${SYNC.startsWith("Error")?`<p class="small" style="color:var(--crit)">${esc(SYNC)}</p>`:""}</div>`;
}
function ptPane(p){
  const c=p.cycles.find(x=>x.id===CURC)||p.cycles[p.cycles.length-1]; if(c) CURC=c.id;
  const pos=poseidon(p);
  const f=(id,l,val,type="text",extra="")=>`<label class="f" for="f_${id}">${l}<input id="f_${id}" data-f="${id}" type="${type}" value="${esc(val??"")}" ${extra}></label>`;
  return `${p.example?`<div class="callout warn"><p>This is an <b>example</b> for demonstration.</p></div>`:""}
  <h2 style="margin-top:0">Folder: ${esc(p.code||"new patient")}</h2>
  <div class="card"><h3>Patient details</h3><div class="form">
   ${f("code","Patient code",p.code)}${f("age","Age",p.age,"number",'min="16" max="55"')}${f("bmi","BMI (kg/m²)",p.bmi,"number",'step="0.1"')}
   ${f("amh","AMH (ng/mL)",p.amh,"number",'step="0.01"')}${f("afc","AFC",p.afc,"number")}${f("prevOoc","Oocytes in prior cycle",p.prevOoc,"number")}
   <label class="f wide" for="f_dx">Diagnosis / indication<input id="f_dx" data-f="dx" value="${esc(p.dx||"")}"></label>
   <label class="f wide" for="f_notes">Notes<input id="f_notes" data-f="notes" value="${esc(p.notes||"")}"></label>
  </div><p class="small" style="margin-bottom:0"><b>POSEIDON:</b> <span class="chip acc">${esc(pos.g)}</span> ${esc(pos.t)} ${cite("{{poseidon16}}")}</p></div>
  <div class="tabs">${p.cycles.map(x=>`<button class="tab${x.id===CURC?" on":""}" data-cyc="${x.id}">${esc(x.label||"Cycle")}</button>`).join("")}<button class="tab" id="addCyc">+ New cycle</button></div>
  ${c?cyclePane(p,c):`<p class="muted">No cycle yet. Press “+ New cycle”.</p>`}
  <div class="row" style="margin-top:18px"><button class="btn danger" id="delPt">Delete folder</button></div>`;
}
function cyclePane(p,c){
  const ctx={...p,...c}, al=alertsFor(ctx), vs=[...c.visits].sort((a,b)=>a.date.localeCompare(b.date)), last=vs[vs.length-1];
  const g=(id,l,val,type="text",extra="")=>`<label class="f" for="c_${id}">${l}<input id="c_${id}" data-cy="${id}" type="${type}" value="${esc(val??"")}" ${extra}></label>`;
  return `<div class="card"><h3>Cycle details</h3><div class="form">
   ${g("label","Cycle name",c.label)}
   <label class="f" for="c_proto">Protocol<select id="c_proto" data-cy="proto">${PROTO_OPTS.map(o=>`<option value="${o[0]}"${c.proto===o[0]?" selected":""}>${o[1]}</option>`).join("")}</select></label>
   ${g("start",FET_IDS.includes(c.proto)?"1st cycle day":"Stimulation day 1",c.start,"date")}${g("fsh",FET_IDS.includes(c.proto)?"Regimen / drugs":"Gonadotropin and dose",c.fsh)}
   ${g("trig",FET_IDS.includes(c.proto)?"hCG (date, time)":"Trigger (date, time)",c.trig,"datetime-local")}</div></div>
  <h3>Alerts</h3>
  ${al.map(([k,t,d])=>`<div class="alert ${k}"><span class="dot"></span><div><b>${esc(t)}</b><span class="small">${esc(d)}</span></div></div>`).join("")}
  <p class="small muted">Alerts are based on the latest visit and on the thresholds you set under “Thresholds”. They are decision support, not instructions.</p>
  ${last?`<div class="kpis"><div class="kpi"><div class="v">${dayOf(ctx,last)}</div><div class="l">${FET_IDS.includes(c.proto)?"Cycle day":"Stimulation day"}</div></div><div class="kpi"><div class="v">${sizes(last).length?Math.max(...sizes(last)):"–"}</div><div class="l">Lead (mm)</div></div><div class="kpi"><div class="v">${sizes(last).filter(x=>x>=DB.cfg.ohssSize).length}</div><div class="l">Follicles ≥ ${DB.cfg.ohssSize} mm</div></div><div class="kpi"><div class="v">${esc(last.e2)||"–"}</div><div class="l">E2 (pg/mL)</div></div><div class="kpi"><div class="v">${esc(last.endo)||"–"}</div><div class="l">Endometrium (mm)</div></div></div><div>${binsRow(last)}</div>`:""}
  <h3>Chart</h3>${chartSVG(ctx)}
  ${outcomeCard(c)}
  <h3>Visits</h3>
  <div class="tblwrap"><table><thead><tr><th>Date</th><th>Day</th><th>Type</th><th>Right (mm)</th><th>Left (mm)</th><th>E2</th><th>LH</th><th>P4</th><th>Endom.</th><th>Drugs</th><th></th></tr></thead><tbody>
  ${vs.map(v=>`<tr><td class="mono">${esc(v.date)}</td><td class="mono">${dayOf(ctx,v)}</td><td>${esc((VTYPES.find(t=>t[0]===v.type)||[])[1]||"")}</td><td class="mono">${esc(v.R)}</td><td class="mono">${esc(v.L)}</td><td class="mono">${esc(v.e2)}</td><td class="mono">${esc(v.lh)}</td><td class="mono">${esc(v.p4)}</td><td class="mono">${esc(v.endo)}${v.pat?`<div class="small muted">${esc(v.pat)}</div>`:""}</td><td class="small">${esc(v.drugs)}</td><td><button class="btn sm" data-ev="${v.id}">Edit</button></td></tr>`).join("")||`<tr><td colspan="11" class="muted">No visits.</td></tr>`}
  </tbody></table></div>
  <div class="row" style="margin-top:10px"><button class="btn pri" id="addV">+ New visit</button>${(p.cycles.length>1)?`<button class="btn danger" id="delCyc">Delete cycle</button>`:""}</div>`;
}
function refreshTracker(){$("#view").innerHTML=pageTracker();bindTracker();}
function bindTracker(){
  const go=$("#pwGo");
  if(MODE==="cloud-locked"&&go){
    const msg=t=>$("#pwMsg").textContent=t;
    go.onclick=async()=>{
      go.disabled=true;
      try{
        if(USERMETA){msg("Checking…");const ok=await unlock($("#pwU").value);if(!ok){msg("Wrong passphrase.");go.disabled=false;}}
        else{const a=$("#pw1").value,b=$("#pw2").value;if(a.length<10){msg("At least 10 characters are needed.");go.disabled=false;return;}if(a!==b){msg("The two passphrases do not match.");go.disabled=false;return;}msg("Creating…");await setupPass(a);}
      }catch(e){msg("Error: "+(e.code||e.message));go.disabled=false;}
    };
    document.querySelectorAll("#pwU,#pw2").forEach(i=>i.addEventListener("keydown",e=>{if(e.key==="Enter")go.click();}));
    return;
  }
  if(!$("#newPt")) return;
  const imp=$("#impLocal"); if(imp) imp.onclick=()=>{const L=(readLocal()||{patients:[]}).patients.filter(x=>!x.example);const have=new Set(DB.patients.map(x=>x.id));L.forEach(x=>{if(have.has(x.id))x.id=uid();DB.patients.push(x);});save();refreshTracker();};
  document.querySelectorAll("[data-pt]").forEach(b=>b.onclick=()=>{CUR=b.dataset.pt;CURC=null;refreshTracker();});
  $("#ptSearch").oninput=e=>{$("#ptList").innerHTML=ptListHTML(e.target.value);document.querySelectorAll("[data-pt]").forEach(b=>b.onclick=()=>{CUR=b.dataset.pt;CURC=null;refreshTracker();});};
  $("#newPt").onclick=()=>{const c=newCycle(1);const n={id:uid(),code:"",age:"",bmi:"",amh:"",afc:"",prevOoc:"",dx:"",notes:"",cycles:[c]};DB.patients.unshift(n);CUR=n.id;CURC=c.id;save();refreshTracker();setTimeout(()=>{const e=$("#f_code");e&&e.focus();},30);};
  $("#cfgBtn").onclick=cfgForm;
  $("#bkCopy").onclick=async()=>{const t=JSON.stringify(DB);try{await navigator.clipboard.writeText(t);$("#bkMsg").textContent="Copied (unencrypted). Keep it somewhere safe.";}catch(e){openDlg(`<h3 style="margin-top:0">Backup</h3><p class="small">Select and copy the text. It is not encrypted.</p><textarea readonly>${esc(t)}</textarea><div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn" onclick="closeDlg()">Close</button></div>`);}};
  $("#bkRestore").onclick=()=>{openDlg(`<h3 style="margin-top:0">Restore</h3><p class="small">Paste the backup or choose a .json/.txt file. The folders in the backup will replace the current ones.</p><input type="file" id="rsFile" accept=".json,.txt"><textarea id="rsTxt" style="margin-top:8px"></textarea><p class="small" id="rsMsg" style="color:var(--crit)"></p><div class="row" style="justify-content:flex-end"><button class="btn" onclick="closeDlg()">Cancel</button><button class="btn pri" id="rsGo">Restore</button></div>`);
    $("#rsFile").onchange=e=>{const fl=e.target.files[0];if(fl)fl.text().then(t=>$("#rsTxt").value=t);};
    $("#rsGo").onclick=()=>{try{const d=JSON.parse($("#rsTxt").value);if(!Array.isArray(d.patients))throw 0;DB={patients:d.patients.map(normPatient),cfg:{...DEFCFG,...(d.cfg||{})}};save();CUR=null;CURC=null;closeDlg();refreshTracker();}catch(e){$("#rsMsg").textContent="The text is not a valid backup of this app.";}};};
  const p=DB.patients.find(x=>x.id===CUR); if(!p) return;
  const c=p.cycles.find(x=>x.id===CURC);
  document.querySelectorAll("[data-f]").forEach(el=>el.onchange=()=>{p[el.dataset.f]=el.value.trim();if(el.dataset.f==="code")p.example=false;save();refreshTracker();});
  document.querySelectorAll("[data-cyc]").forEach(b=>b.onclick=()=>{CURC=b.dataset.cyc;refreshTracker();});
  $("#addCyc").onclick=()=>{const n=newCycle(p.cycles.length+1);p.cycles.push(n);CURC=n.id;save();refreshTracker();};
  $("#delPt").onclick=()=>{openDlg(`<h3 style="margin-top:0">Delete folder</h3><p>Permanently delete the folder <b>${esc(p.code||"no code")}</b> with all its cycles and visits?</p><div class="row" style="justify-content:flex-end"><button class="btn" onclick="closeDlg()">Cancel</button><button class="btn pri" id="dGo">Delete</button></div>`);$("#dGo").onclick=()=>{DB.patients=DB.patients.filter(x=>x.id!==p.id);CUR=null;CURC=null;save();closeDlg();refreshTracker();};};
  if(!c) return;
  document.querySelectorAll("[data-cy]").forEach(el=>el.onchange=()=>{c[el.dataset.cy]=el.value.trim();save();refreshTracker();});
  document.querySelectorAll("[data-out]").forEach(el=>el.onchange=()=>{c.out=c.out||{};c.out[el.dataset.out]=el.value.trim();save();refreshTracker();});
  $("#addV").onclick=()=>visitForm(c);
  document.querySelectorAll("[data-ev]").forEach(b=>b.onclick=()=>visitForm(c,c.visits.find(v=>v.id===b.dataset.ev)));
  const dc=$("#delCyc"); if(dc) dc.onclick=()=>{openDlg(`<h3 style="margin-top:0">Delete cycle</h3><p>Permanently delete “${esc(c.label)}» and its visits?</p><div class="row" style="justify-content:flex-end"><button class="btn" onclick="closeDlg()">Cancel</button><button class="btn pri" id="dGo">Delete</button></div>`);$("#dGo").onclick=()=>{p.cycles=p.cycles.filter(x=>x.id!==c.id);CURC=null;save();closeDlg();refreshTracker();};};
}

const RESULTS=["","Pending","Negative","Biochemical pregnancy","Clinical pregnancy","Miscarriage","Ectopic pregnancy","Live birth","Cycle cancelled"];
function pct(a,b){a=+a;b=+b;return (b>0&&a>=0&&a!=="")?Math.round(a/b*100)+"%":"–";}
function outcomeCard(c){
  const o=c.out||{}, isFet=FET_IDS.includes(c.proto);
  const n=(k,l)=>`<label class="f" for="o_${k}">${l}<input id="o_${k}" data-out="${k}" type="number" min="0" value="${esc(o[k]??"")}"></label>`;
  return `<h3>Cycle outcomes</h3><div class="card"><div class="form">
   ${isFet?"":n("oocytes","Oocytes")+n("mii","Mature (MII)")+n("fert","Fertilised (2PN)")+n("blasts","Blastocysts")+n("frozen","Cryopreserved")}
   <label class="f" for="o_etDate">Transfer date<input id="o_etDate" data-out="etDate" type="date" value="${esc(o.etDate||"")}"></label>
   ${n("etN","Embryos transferred")}${n("bhcg","βhCG (IU/L)")}
   <label class="f" for="o_result">Outcome<select id="o_result" data-out="result">${RESULTS.map(r=>`<option${(o.result||"")===r?" selected":""}>${esc(r)}</option>`).join("")}</select></label>
   <label class="f wide" for="o_notes">Outcome notes<input id="o_notes" data-out="notes" value="${esc(o.notes||"")}"></label></div>
   ${isFet?"":`<div style="margin-top:10px"><span class="chip">Maturity: <b class="mono">${pct(o.mii,o.oocytes)}</b></span><span class="chip">Fertilisation: <b class="mono">${pct(o.fert,o.mii)}</b></span><span class="chip">Blastocysts/2PN: <b class="mono">${pct(o.blasts,o.fert)}</b></span></div>`}
   ${o.etDate&&!o.bhcg?`<p class="small muted" style="margin-bottom:0">Suggested serum βhCG after blastocyst transfer: ${isoAdd(o.etDate,9)} to ${isoAdd(o.etDate,11)}.</p>`:""}</div>`;
}
function visitForm(p,v){
  v=v||{id:"",date:new Date().toISOString().slice(0,10),type:"mon",e2:"",lh:"",p4:"",endo:"",pat:"",R:"",L:"",drugs:""};
  const i=(k,l,t="text",x="")=>`<label class="f" for="v_${k}">${l}<input id="v_${k}" data-v="${k}" type="${t}" value="${esc(v[k]??"")}" ${x}></label>`;
  openDlg(`<h3 style="margin-top:0">${v.id?"Edit":"New"} visit</h3><div class="form">
   ${i("date","Date","date")}<label class="f" for="v_type">Type<select id="v_type" data-v="type">${VTYPES.map(t=>`<option value="${t[0]}"${v.type===t[0]?" selected":""}>${t[1]}</option>`).join("")}</select></label>
   <label class="f wide" for="v_R">Right ovary: sizes in mm, comma-separated<input id="v_R" data-v="R" value="${esc(v.R)}" placeholder="e.g. 18,17,15,12" inputmode="decimal"></label>
   <label class="f wide" for="v_L">Left ovary: sizes in mm<input id="v_L" data-v="L" value="${esc(v.L)}" placeholder="e.g. 16,14,11" inputmode="decimal"></label>
   ${i("e2","E2 (pg/mL)","number")}${i("lh","LH (IU/L)","number",'step="0.1"')}${i("p4","P4 (ng/mL)","number",'step="0.01"')}${i("endo","Endometrium (mm)","number",'step="0.1"')}
   ${i("pat","Endometrial pattern")}<label class="f wide" for="v_drugs">Drugs / doses<input id="v_drugs" data-v="drugs" value="${esc(v.drugs)}"></label></div>
   <p class="small muted">Units: E2 pmol/L ÷ 3.67 = pg/mL · P4 nmol/L ÷ 3.18 = ng/mL</p>
   <div class="row" style="justify-content:flex-end;margin-top:12px">${v.id?`<button class="btn danger" id="vDel">Delete</button>`:""}<button class="btn" id="vCancel">Cancel</button><button class="btn pri" id="vSave">Save</button></div>`);
  $("#vCancel").onclick=closeDlg;
  if(v.id) $("#vDel").onclick=()=>{p.visits=p.visits.filter(x=>x.id!==v.id);save();closeDlg();refreshTracker();};
  $("#vSave").onclick=()=>{
    const nv={id:v.id||uid()}; document.querySelectorAll("[data-v]").forEach(el=>nv[el.dataset.v]=el.value.trim());
    if(!nv.date){$("#v_date").focus();return;}
    const ix=p.visits.findIndex(x=>x.id===nv.id); if(ix>=0)p.visits[ix]=nv; else p.visits.push(nv);
    save();closeDlg();refreshTracker();
  };
}
function cfgForm(){
  const c=DB.cfg, L={trigN:"Trigger: number of follicles",trigSize:"Trigger: size (mm)",ohssN:"OHSS: number of follicles",ohssSize:"OHSS: size (mm)",e2Ohss:"OHSS: E2 (pg/mL)",p4Trig:"P4 for freeze-all (ng/mL)",lhSurge:"Premature LH (IU/L)",antFix:"Antagonist fixed: day",antFlex:"Antagonist flexible: mm",endoMin:"FET: minimum endometrium (mm)",p4ET:"FET: minimum P4 on ET day",opuH:"Hours trigger → OPU"};
  openDlg(`<h3 style="margin-top:0">Alert thresholds</h3><p class="small muted">Adjust to your unit's protocols.</p><div class="form">${Object.keys(L).map(k=>`<label class="f" for="c_${k}">${L[k]}<input id="c_${k}" data-c="${k}" type="number" step="0.1" value="${c[k]}"></label>`).join("")}</div>
  <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn" id="cReset">Defaults</button><button class="btn" id="cCancel">Cancel</button><button class="btn pri" id="cSave">Save</button></div>`);
  $("#cCancel").onclick=closeDlg;
  $("#cReset").onclick=()=>{DB.cfg={...DEFCFG};save();closeDlg();refreshTracker();};
  $("#cSave").onclick=()=>{document.querySelectorAll("[data-c]").forEach(el=>{const n=parseFloat(el.value);if(!isNaN(n))DB.cfg[el.dataset.c]=n;});save();closeDlg();refreshTracker();};
}
function openDlg(h){$("#dlgBox").innerHTML=h;$("#dlg").classList.add("on");const f=$("#dlgBox input,#dlgBox select,#dlgBox button");f&&f.focus();}
function closeDlg(){$("#dlg").classList.remove("on");}
/* ================= STARTUP ================= */
loadLocal();
renderAcct();
initFirebase();
$("#dlg").addEventListener("click",e=>{if(e.target.id==="dlg")closeDlg();});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDlg();});
$("#menuBtn").onclick=()=>$("#side").classList.toggle("open");
window.addEventListener("hashchange",route);
route();
</script>
</body>
</html>
